,"definition":"by this time at the latest","translation":"không muộn hơn, chậm nhất là"}],"examples":[{"sentence":"Submissions must arrive no later than 5 p.m. on March 3.","translation":"Bài nộp phải đến chậm nhất là 5 giờ chiều ngày 3 tháng 3."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"effective-immediately","term":"effective immediately","ipa":"/ɪˈfɛktɪv ɪˈmiːdiətli/","meanings":[{"pos":"phrase","definition":"starting right now","translation":"có hiệu lực ngay lập tức"}],"examples":[{"sentence":"Effective immediately, visitors must sign in at the front desk.","translation":"Có hiệu lực ngay, khách phải đăng ký tại quầy lễ tân."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"until-further-notice","term":"until further notice","ipa":"/ənˈtɪl ˈfɜːrðər ˈnoʊtɪs/","meanings":[{"pos":"phrase","definition":"until you are told otherwise","translation":"cho đến khi có thông báo mới"}],"examples":[{"sentence":"The east entrance is closed until further notice.","translation":"Lối vào phía đông đóng cho đến khi có thông báo mới."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"on-a-first-come-first-served-basis","term":"on a first-come, first-served basis","ipa":"/ɒn ə ˌfɜːrst kʌm ˌfɜːrst sɜːrvd ˈbeɪsɪs/","meanings":[{"pos":"phrase","definition":"in the order that people arrive or apply","translation":"theo thứ tự đến trước phục vụ trước"}],"examples":[{"sentence":"Seats are assigned on a first-come, first-served basis.","translation":"Chỗ ngồi được sắp xếp theo thứ tự đến trước phục vụ trước."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"venue","term":"venue","ipa":"/ˈvɛnjuː/","meanings":[{"pos":"n.","definition":"the place where an event happens","translation":"địa điểm tổ chức"}],"examples":[{"sentence":"The conference venue was moved to accommodate more attendees.","translation":"Địa điểm hội nghị được dời để chứa thêm người tham dự."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"keynote","term":"keynote","ipa":"/ˈkiːnoʊt/","meanings":[{"pos":"n.","definition":"the main speech at a conference","translation":"bài phát biểu chính"}],"examples":[{"sentence":"The keynote will be streamed live for remote participants.","translation":"Bài phát biểu chính sẽ được phát trực tiếp cho người tham dự từ xa."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"agenda","term":"agenda","ipa":"/əˈdʒɛndə/","meanings":[{"pos":"n.","definition":"a list of items to be discussed at a meeting","translation":"chương trình nghị sự"}],"examples":[{"sentence":"Item three on the agenda is the budget review.","translation":"Mục ba trong chương trình là rà soát ngân sách."}],"context":"Part 7","skill":"vocab","difficulty":2},{"id":"minutes","term":"minutes","ipa":"/ˈmɪnɪts/","meanings":[{"pos":"n.","definition":"a written record of what was said at a meeting","translation":"biên bản cuộc họp"}],"examples":[{"sentence":"The minutes from last week’s meeting are attached for approval.","translation":"Biên bản cuộc họp tuần trước được đính kèm để phê duyệt."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"premises","term":"premises","ipa":"/ˈprɛmɪsɪz/","meanings":[{"pos":"n.","definition":"a building and its land used by a business","translation":"khuôn viên, cơ sở"}],"examples":[{"sentence":"Smoking is not permitted anywhere on the premises.","translation":"Không được hút thuốc ở bất kỳ đâu trong khuôn viên."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"tenant","term":"tenant","ipa":"/ˈtɛnənt/","meanings":[{"pos":"n.","definition":"a person who rents property from a landlord","translation":"người thuê"}],"examples":[{"sentence":"Tenants must give 60 days’ notice before moving out.","translation":"Người thuê phải báo trước 60 ngày trước khi chuyển đi."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"landlord","term":"landlord","ipa":"/ˈlændlɔːrd/","meanings":[{"pos":"n.","definition":"a person who rents out property to others","translation":"chủ nhà cho thuê"}],"examples":[{"sentence":"The landlord agreed to repaint the office before the lease begins.","translation":"Chủ nhà đồng ý sơn lại văn phòng trước khi hợp đồng thuê bắt đầu."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"vendor","term":"vendor","ipa":"/ˈvɛndər/","meanings":[{"pos":"n.","definition":"a company or person that sells goods or services","translation":"nhà cung cấp, bên bán"}],"examples":[{"sentence":"The preferred vendor list is reviewed every two years.","translation":"Danh sách nhà cung cấp ưu tiên được rà soát hai năm một lần."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"shareholder","term":"shareholder","ipa":"/ˈʃɛərhoʊldər/","meanings":[{"pos":"n.","definition":"a person who owns shares in a company","translation":"cổ đông"}],"examples":[{"sentence":"Shareholders will vote on the new board at the annual meeting.","translation":"Cổ đông sẽ bỏ phiếu bầu hội đồng mới tại đại hội thường niên."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"dividend","term":"dividend","ipa":"/ˈdɪvɪdɛnd/","meanings":[{"pos":"n.","definition":"a share of profits paid to shareholders","translation":"cổ tức"}],"examples":[{"sentence":"The company raised its quarterly dividend for the third year running.","translation":"Công ty tăng cổ tức hàng quý năm thứ ba liên tiếp."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"fiscal-year","term":"fiscal year","ipa":"/ˈfɪskl jɪər/","meanings":[{"pos":"phrase","definition":"a one-year period used for accounting","translation":"năm tài chính"}],"examples":[{"sentence":"Our fiscal year ends on March 31.","translation":"Năm tài chính của chúng tôi kết thúc vào ngày 31 tháng 3."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"clearance","term":"clearance","ipa":"/ˈklɪərəns/","meanings":[{"pos":"n.","definition":"official permission for something to happen","translation":"sự cho phép, thông quan"},{"pos":"n.","definition":"a sale to clear old stock","translation":"đợt xả hàng"}],"examples":[{"sentence":"The shipment is awaiting customs clearance at the port.","translation":"Lô hàng đang chờ thông quan tại cảng."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"endorsement","term":"endorsement","ipa":"/ɪnˈdɔːrsmənt/","meanings":[{"pos":"n.","definition":"public support or approval of someone or something","translation":"sự ủng hộ, chứng thực"}],"examples":[{"sentence":"The product gained an endorsement from a leading industry group.","translation":"Sản phẩm nhận được sự chứng thực từ một hiệp hội ngành hàng đầu."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"recall","term":"recall","ipa":"/rɪˈkɔːl/","meanings":[{"pos":"n.","definition":"a request to return a faulty product","translation":"đợt thu hồi sản phẩm"}],"examples":[{"sentence":"The manufacturer issued a voluntary recall of the affected batch.","translation":"Nhà sản xuất tự nguyện thu hồi lô hàng bị ảnh hưởng."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"run-out-of","term":"run out of","ipa":"/rʌn aʊt əv/","meanings":[{"pos":"phrasal v.","definition":"to use all of something so none is left","translation":"hết, dùng cạn"}],"examples":[{"sentence":"We’ve run out of toner, so I’ve ordered more.","translation":"Chúng ta hết mực in rồi nên tôi đã đặt thêm."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"fill-in-for","term":"fill in for","ipa":"/fɪl ɪn fɔːr/","meanings":[{"pos":"phrasal v.","definition":"to do someone’s job temporarily","translation":"làm thay, trực thay"}],"examples":[{"sentence":"Can you fill in for Maria at the front desk this afternoon?","translation":"Chiều nay bạn trực thay Maria ở quầy lễ tân được không?"}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"drop-off","term":"drop off","ipa":"/drɒp ɒf/","meanings":[{"pos":"phrasal v.","definition":"to leave something or someone at a place","translation":"đưa/để lại ở đâu đó"}],"examples":[{"sentence":"I’ll drop off the samples at the lab on my way home.","translation":"Tôi sẽ để mẫu ở phòng thí nghiệm trên đường về nhà."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"look-over","term":"look over","ipa":"/lʊk ˈoʊvər/","meanings":[{"pos":"phrasal v.","definition":"to examine something quickly","translation":"xem qua, kiểm tra nhanh"}],"examples":[{"sentence":"Could you look over these figures before I send them?","translation":"Bạn xem qua mấy con số này trước khi tôi gửi được không?"}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"put-off","term":"put off","ipa":"/pʊt ɒf/","meanings":[{"pos":"phrasal v.","definition":"to postpone","translation":"hoãn lại"}],"examples":[{"sentence":"They put off the site visit because of the storm.","translation":"Họ hoãn chuyến thăm công trường vì bão."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"set-up","term":"set up","ipa":"/sɛt ʌp/","meanings":[{"pos":"phrasal v.","definition":"to arrange or organize something","translation":"sắp xếp, thiết lập"}],"examples":[{"sentence":"I’ll set up a call with the vendor for Thursday.","translation":"Tôi sẽ sắp xếp cuộc gọi với nhà cung cấp vào thứ Năm."}],"context":"Listening Part 3","skill":"vocab","difficulty":2},{"id":"get-back-to","term":"get back to","ipa":"/ɡɛt bæk tuː/","meanings":[{"pos":"phrasal v.","definition":"to reply to someone later","translation":"phản hồi lại sau"}],"examples":[{"sentence":"Let me check the schedule and get back to you.","translation":"Để tôi xem lịch rồi phản hồi lại bạn."}],"context":"Listening Part 3","skill":"vocab","difficulty":2},{"id":"stop-by","term":"stop by","ipa":"/stɒp baɪ/","meanings":[{"pos":"phrasal v.","definition":"to make a short visit","translation":"ghé qua"}],"examples":[{"sentence":"I’ll stop by your office after lunch to pick up the keys.","translation":"Tôi sẽ ghé văn phòng bạn sau bữa trưa để lấy chìa khoá."}],"context":"Listening Part 3","skill":"vocab","difficulty":2},{"id":"run-behind","term":"run behind","ipa":"/rʌn bɪˈhaɪnd/","meanings":[{"pos":"phrasal v.","definition":"to be late or slower than planned","translation":"trễ so với lịch"}],"examples":[{"sentence":"The morning sessions are running behind by about 20 minutes.","translation":"Các phiên buổi sáng đang trễ khoảng 20 phút."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"sort-out","term":"sort out","ipa":"/sɔːrt aʊt/","meanings":[{"pos":"phrasal v.","definition":"to resolve a problem","translation":"giải quyết, xử lý"}],"examples":[{"sentence":"IT is sorting out the login issue right now.","translation":"Bộ phận công nghệ thông tin đang xử lý lỗi đăng nhập ngay bây giờ."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"hold-off","term":"hold off","ipa":"/hoʊld ɒf/","meanings":[{"pos":"phrasal v.","definition":"to delay doing something","translation":"khoan, tạm chưa làm"}],"examples":[{"sentence":"Let’s hold off on ordering until we confirm the numbers.","translation":"Khoan hãy đặt hàng cho đến khi xác nhận số liệu."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"catch-up-on","term":"catch up on","ipa":"/kætʃ ʌp ɒn/","meanings":[{"pos":"phrasal v.","definition":"to do work that you should have done earlier","translation":"làm bù, cập nhật lại"}],"examples":[{"sentence":"I need an hour to catch up on email after the trip.","translation":"Tôi cần một tiếng để xử lý bù email sau chuyến đi."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"be-tied-up","term":"be tied up","ipa":"/biː taɪd ʌp/","meanings":[{"pos":"phrase","definition":"to be very busy and unavailable","translation":"bận không rảnh"}],"examples":[{"sentence":"She’s tied up in a meeting until three.","translation":"Cô ấy bận họp đến ba giờ."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"give-someone-a-hand","term":"give someone a hand","ipa":"/ɡɪv ˈsʌmwʌn ə hænd/","meanings":[{"pos":"phrase","definition":"to help someone","translation":"giúp một tay"}],"examples":[{"sentence":"Could you give me a hand moving these boxes?","translation":"Bạn giúp tôi một tay chuyển mấy thùng này nhé?"}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"be-out-of-the-office","term":"be out of the office","ipa":"/biː aʊt əv ði ˈɒfɪs/","meanings":[{"pos":"phrase","definition":"to be away from work","translation":"đang vắng mặt, đi công tác"}],"examples":[{"sentence":"He’ll be out of the office until Monday.","translation":"Anh ấy sẽ vắng mặt cho đến thứ Hai."}],"context":"Listening Part 3","skill":"vocab","difficulty":2},{"id":"walk-through","term":"walk-through","ipa":"/ˈwɔːk θruː/","meanings":[{"pos":"n.","definition":"a step-by-step demonstration or inspection","translation":"buổi hướng dẫn/khảo sát từng bước"}],"examples":[{"sentence":"The contractor scheduled a walk-through of the renovated floor.","translation":"Nhà thầu lên lịch khảo sát từng bước tầng vừa cải tạo."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"shift","term":"shift","ipa":"/ʃɪft/","meanings":[{"pos":"n.","definition":"a set period of work","translation":"ca làm việc"}],"examples":[{"sentence":"I can swap my Saturday shift with someone from the other team.","translation":"Tôi có thể đổi ca thứ Bảy với người ở nhóm kia."}],"context":"Listening Part 3","skill":"vocab","difficulty":2},{"id":"cover-for","term":"cover for","ipa":"/ˈkʌvər fɔːr/","meanings":[{"pos":"phrasal v.","definition":"to do the work of an absent colleague","translation":"trực/làm hộ"}],"examples":[{"sentence":"Thanks for covering for me while I was on leave.","translation":"Cảm ơn đã làm hộ tôi trong lúc tôi nghỉ phép."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"reschedule","term":"reschedule","ipa":"/ˌriːˈʃɛdjuːl/","meanings":[{"pos":"v.","definition":"to change the time of a planned event","translation":"dời lịch"}],"examples":[{"sentence":"We had to reschedule the interview for next week.","translation":"Chúng tôi phải dời lịch phỏng vấn sang tuần sau."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"be-short-staffed","term":"be short-staffed","ipa":"/biː ˌʃɔːrt ˈstɑːft/","meanings":[{"pos":"phrase","definition":"to not have enough workers","translation":"thiếu nhân sự"}],"examples":[{"sentence":"The kitchen is short-staffed this weekend, so service may be slow.","translation":"Bếp thiếu người cuối tuần này nên phục vụ có thể chậm."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"attendee","term":"attendee","ipa":"/əˌtɛnˈdiː/","meanings":[{"pos":"n.","definition":"a person who goes to an event","translation":"người tham dự"}],"examples":[{"sentence":"Attendees are asked to silence their phones before the session.","translation":"Người tham dự được đề nghị tắt tiếng điện thoại trước phiên họp."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"proceed-to","term":"proceed to","ipa":"/prəˈsiːd tuː/","meanings":[{"pos":"phrasal v.","definition":"to move toward a place","translation":"di chuyển đến, tiến về"}],"examples":[{"sentence":"Passengers should now proceed to gate 12 for boarding.","translation":"Hành khách vui lòng di chuyển đến cửa 12 để lên máy bay."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"be-advised","term":"be advised","ipa":"/biː ədˈvaɪzd/","meanings":[{"pos":"phrase","definition":"a formal way to say \"please note\"","translation":"xin lưu ý"}],"examples":[{"sentence":"Please be advised that the parking lot will close at 10 p.m.","translation":"Xin lưu ý rằng bãi đỗ xe sẽ đóng lúc 10 giờ tối."}],"context":"Listening Part 4","skill":"vocab","difficulty":4},{"id":"undergo","term":"undergo","ipa":"/ˌʌndərˈɡoʊ/","meanings":[{"pos":"v.","definition":"to experience something, especially a change or process","translation":"trải qua (quá trình)"}],"examples":[{"sentence":"The lobby will undergo renovation starting next month.","translation":"Sảnh sẽ được cải tạo bắt đầu từ tháng sau."}],"context":"Listening Part 4","skill":"vocab","difficulty":4},{"id":"temporarily","term":"temporarily","ipa":"/ˈtɛmpərɛrɪli/","meanings":[{"pos":"adv.","definition":"for a limited time only","translation":"tạm thời"}],"examples":[{"sentence":"The elevator is temporarily out of service for maintenance.","translation":"Thang máy tạm ngừng hoạt động để bảo trì."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"be-subject-to-delays","term":"be subject to delays","ipa":"/biː ˈsʌbdʒɪkt tuː dɪˈleɪz/","meanings":[{"pos":"phrase","definition":"likely to be delayed","translation":"có thể bị chậm trễ"}],"examples":[{"sentence":"Deliveries in the region may be subject to delays this week.","translation":"Việc giao hàng trong khu vực có thể bị chậm trễ tuần này."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"be-located","term":"be located","ipa":"/biː loʊˈkeɪtɪd/","meanings":[{"pos":"phrase","definition":"to be in a particular place","translation":"nằm ở, toạ lạc tại"}],"examples":[{"sentence":"The registration desk is located just past the main entrance.","translation":"Quầy đăng ký nằm ngay sau lối vào chính."}],"context":"Listening Part 4","skill":"vocab","difficulty":2},{"id":"refreshments","term":"refreshments","ipa":"/rɪˈfrɛʃmənts/","meanings":[{"pos":"n.","definition":"light food and drinks served at an event","translation":"đồ ăn nhẹ và thức uống"}],"examples":[{"sentence":"Refreshments will be served in the atrium during the break.","translation":"Đồ ăn nhẹ sẽ được phục vụ ở sảnh lớn trong giờ giải lao."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"voucher","term":"voucher","ipa":"/ˈvaʊtʃər/","meanings":[{"pos":"n.","definition":"a ticket that can be exchanged for goods or a discount","translation":"phiếu giảm giá, phiếu quà tặng"}],"examples":[{"sentence":"Affected passengers will receive a meal voucher at the desk.","translation":"Hành khách bị ảnh hưởng sẽ nhận phiếu ăn tại quầy."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"be-underway","term":"be underway","ipa":"/biː ˌʌndərˈweɪ/","meanings":[{"pos":"phrase","definition":"to have started and be in progress","translation":"đang diễn ra"}],"examples":[{"sentence":"Repairs to the north platform are already underway.","translation":"Việc sửa chữa sân ga phía bắc đã đang được tiến hành."}],"context":"Listening Part 4","skill":"vocab","difficulty":4},{"id":"detour","term":"detour","ipa":"/ˈdiːtʊr/","meanings":[{"pos":"n.","definition":"a longer route used because the usual one is blocked","translation":"đường vòng, lối tránh"}],"examples":[{"sentence":"Drivers should follow the marked detour around the construction zone.","translation":"Lái xe nên đi theo lối tránh có biển báo quanh khu công trường."}],"context":"Listening Part 4","skill":"vocab","difficulty":4},{"id":"commuter","term":"commuter","ipa":"/kəˈmjuːtər/","meanings":[{"pos":"n.","definition":"a person who travels regularly between home and work","translation":"người đi làm bằng phương tiện công cộng"}],"examples":[{"sentence":"The new line is expected to cut commuter travel time by 15 minutes.","translation":"Tuyến mới dự kiến rút ngắn thời gian đi lại của người đi làm 15 phút."}],"context":"Listening Part 4","skill":"vocab","difficulty":3},{"id":"be-scheduled-to","term":"be scheduled to","ipa":"/biː ˈʃɛdjuːld tuː/","meanings":[{"pos":"phrase","definition":"to be planned to happen at a certain time","translation":"được lên lịch để"}],"examples":[{"sentence":"The keynote is scheduled to begin at 9 sharp.","translation":"Bài phát biểu chính được lên lịch bắt đầu đúng 9 giờ."}],"context":"Listening Part 4","skill":"collocation","difficulty":3},{"id":"weather-permitting","term":"weather permitting","ipa":"/ˈwɛðər pərˈmɪtɪŋ/","meanings":[{"pos":"phrase","definition":"if the weather is good enough","translation":"nếu thời tiết cho phép"}],"examples":[{"sentence":"The outdoor tour will run at noon, weather permitting.","translation":"Chuyến tham quan ngoài trời sẽ diễn ra vào trưa, nếu thời tiết cho phép."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"complimentary-shuttle","term":"complimentary shuttle","ipa":"/ˌkɒmplɪˈmɛntəri ˈʃʌtl/","meanings":[{"pos":"phrase","definition":"a free bus service between two points","translation":"xe đưa đón miễn phí"}],"examples":[{"sentence":"A complimentary shuttle runs between the hotel and the airport every 30 minutes.","translation":"Xe đưa đón miễn phí chạy giữa khách sạn và sân bay mỗi 30 phút."}],"context":"Listening Part 4","skill":"collocation","difficulty":3},{"id":"be-asked-to","term":"be asked to","ipa":"/biː æskt tuː/","meanings":[{"pos":"phrase","definition":"to be politely told to do something","translation":"được yêu cầu"}],"examples":[{"sentence":"Visitors are asked to wear a badge at all times.","translation":"Khách được yêu cầu đeo thẻ mọi lúc."}],"context":"Listening Part 4","skill":"grammar","difficulty":2},{"id":"to-accommodate","term":"to accommodate","ipa":"/tuː əˈkɒmədeɪt/","meanings":[{"pos":"v.","definition":"to provide enough space or to fit needs","translation":"chứa được, đáp ứng"}],"examples":[{"sentence":"The hall was reconfigured to accommodate 400 guests.","translation":"Đại sảnh được bố trí lại để chứa 400 khách."}],"context":"Listening Part 4","skill":"vocab","difficulty":4},{"id":"inclement-weather","term":"inclement weather","ipa":"/ɪnˈklɛmənt ˈwɛðər/","meanings":[{"pos":"phrase","definition":"bad weather, especially cold or stormy","translation":"thời tiết xấu"}],"examples":[{"sentence":"In case of inclement weather, the event moves to the main hall.","translation":"Trong trường hợp thời tiết xấu, sự kiện chuyển vào đại sảnh."}],"context":"Listening Part 4","skill":"collocation","difficulty":5},{"id":"be-encouraged-to","term":"be encouraged to","ipa":"/biː ɪnˈkɜːrɪdʒd tuː/","meanings":[{"pos":"phrase","definition":"to be advised to do something beneficial","translation":"được khuyến khích"}],"examples":[{"sentence":"Staff are encouraged to submit ideas through the new portal.","translation":"Nhân viên được khuyến khích gửi ý tưởng qua cổng mới."}],"context":"Listening Part 4","skill":"grammar","difficulty":3},{"id":"pick-up","term":"pick up","ipa":"/pɪk ʌp/","meanings":[{"pos":"phrasal v.","definition":"to collect someone or something","translation":"đón, lấy"},{"pos":"phrasal v.","definition":"to improve","translation":"khởi sắc, tăng lên"}],"examples":[{"sentence":"Sales usually pick up in the last two weeks of the quarter.","translation":"Doanh số thường tăng trong hai tuần cuối quý."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"turn-in","term":"turn in","ipa":"/tɜːrn ɪn/","meanings":[{"pos":"phrasal v.","definition":"to submit or hand over something","translation":"nộp"}],"examples":[{"sentence":"Please turn in your expense reports by Friday.","translation":"Vui lòng nộp báo cáo chi phí trước thứ Sáu."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"go-over","term":"go over","ipa":"/ɡoʊ ˈoʊvər/","meanings":[{"pos":"phrasal v.","definition":"to review or discuss something in detail","translation":"xem lại, rà soát"}],"examples":[{"sentence":"Let’s go over the checklist one more time before we open.","translation":"Hãy rà soát danh sách kiểm tra thêm một lần nữa trước khi mở cửa."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"come-up-with","term":"come up with","ipa":"/kʌm ʌp wɪð/","meanings":[{"pos":"phrasal v.","definition":"to think of an idea or plan","translation":"nghĩ ra, đưa ra"}],"examples":[{"sentence":"The team came up with three ways to cut shipping costs.","translation":"Nhóm nghĩ ra ba cách để giảm chi phí vận chuyển."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"fall-through","term":"fall through","ipa":"/fɔːl θruː/","meanings":[{"pos":"phrasal v.","definition":"to fail to happen","translation":"đổ bể, không thành"}],"examples":[{"sentence":"The sponsorship deal fell through at the last minute.","translation":"Thoả thuận tài trợ đổ bể vào phút chót."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"be-up-to-speed","term":"be up to speed","ipa":"/biː ʌp tuː spiːd/","meanings":[{"pos":"phrase","definition":"to have the latest information about something","translation":"nắm được tình hình mới nhất"}],"examples":[{"sentence":"Take a few minutes to get the new hire up to speed on the process.","translation":"Dành vài phút để giúp nhân viên mới nắm quy trình."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"be-on-the-same-page","term":"be on the same page","ipa":"/biː ɒn ðə seɪm peɪdʒ/","meanings":[{"pos":"phrase","definition":"to have the same understanding of something","translation":"thống nhất quan điểm"}],"examples":[{"sentence":"Let’s meet briefly so everyone is on the same page.","translation":"Hãy họp nhanh để mọi người thống nhất."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"take-over","term":"take over","ipa":"/teɪk ˈoʊvər/","meanings":[{"pos":"phrasal v.","definition":"to begin to do a job or have control that someone else had","translation":"tiếp quản"}],"examples":[{"sentence":"Priya will take over the account when James retires.","translation":"Priya sẽ tiếp quản khách hàng này khi James nghỉ hưu."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"be-running-low-on","term":"be running low on","ipa":"/biː ˈrʌnɪŋ loʊ ɒn/","meanings":[{"pos":"phrase","definition":"to have little of something left","translation":"sắp hết"}],"examples":[{"sentence":"We’re running low on packaging materials in the east warehouse.","translation":"Kho phía đông sắp hết vật liệu đóng gói."}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"hand-out","term":"hand out","ipa":"/hænd aʊt/","meanings":[{"pos":"phrasal v.","definition":"to give something to each person in a group","translation":"phát (cho mọi người)"}],"examples":[{"sentence":"The ushers will hand out programs at the door.","translation":"Nhân viên hướng dẫn sẽ phát chương trình ở cửa."}],"context":"Listening Part 4","skill":"vocab","difficulty":2},{"id":"sign-up-for","term":"sign up for","ipa":"/saɪn ʌp fɔːr/","meanings":[{"pos":"phrasal v.","definition":"to put your name on a list to join something","translation":"đăng ký tham gia"}],"examples":[{"sentence":"Employees can sign up for the wellness program online.","translation":"Nhân viên có thể đăng ký chương trình chăm sóc sức khoẻ trực tuyến."}],"context":"Listening Part 4","skill":"vocab","difficulty":2},{"id":"be-held","term":"be held","ipa":"/biː hɛld/","meanings":[{"pos":"phrase","definition":"to take place (of an event)","translation":"được tổ chức"}],"examples":[{"sentence":"This year’s conference will be held in Singapore.","translation":"Hội nghị năm nay sẽ được tổ chức tại Singapore."}],"context":"Listening Part 4","skill":"grammar","difficulty":3},{"id":"wrap-up","term":"wrap up","ipa":"/ræp ʌp/","meanings":[{"pos":"phrasal v.","definition":"to finish or complete something","translation":"kết thúc, hoàn tất"}],"examples":[{"sentence":"We should wrap up the meeting in the next ten minutes.","translation":"Chúng ta nên kết thúc cuộc họp trong mười phút tới."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"be-about-to","term":"be about to","ipa":"/biː əˈbaʊt tuː/","meanings":[{"pos":"phrase","definition":"going to do something very soon","translation":"sắp sửa"}],"examples":[{"sentence":"The presentation is about to start, so please take your seats.","translation":"Bài thuyết trình sắp bắt đầu, vui lòng an vị."}],"context":"Listening Part 4","skill":"grammar","difficulty":2},{"id":"check-in","term":"check in","ipa":"/tʃɛk ɪn/","meanings":[{"pos":"phrasal v.","definition":"to register your arrival at a hotel, airport, or event","translation":"làm thủ tục nhận phòng/vào"}],"examples":[{"sentence":"Guests may check in any time after 3 p.m.","translation":"Khách có thể nhận phòng bất kỳ lúc nào sau 3 giờ chiều."}],"context":"Listening Part 4","skill":"vocab","difficulty":2},{"id":"be-swamped","term":"be swamped","ipa":"/biː swɒmpt/","meanings":[{"pos":"phrase","definition":"to have far too much work","translation":"ngập việc"}],"examples":[{"sentence":"I’m swamped this morning; can we talk after lunch?","translation":"Sáng nay tôi ngập việc; nói chuyện sau bữa trưa được không?"}],"context":"Listening Part 3","skill":"vocab","difficulty":4},{"id":"in-my-opinion","term":"in my opinion","ipa":"/ɪn maɪ əˈpɪnjən/","meanings":[{"pos":"phrase","definition":"used to introduce a personal view","translation":"theo tôi"}],"examples":[{"sentence":"In my opinion, remote work should remain an option for the team.","translation":"Theo tôi, làm việc từ xa nên vẫn là một lựa chọn cho nhóm."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"i-would-argue-that","term":"I would argue that","ipa":"/aɪ wʊd ˈɑːrɡjuː ðæt/","meanings":[{"pos":"phrase","definition":"a formal way to state and defend a position","translation":"tôi cho rằng"}],"examples":[{"sentence":"I would argue that investing in training pays off within a year.","translation":"Tôi cho rằng đầu tư vào đào tạo sẽ có lãi trong vòng một năm."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"on-the-one-hand","term":"on the one hand","ipa":"/ɒn ðə wʌn hænd/","meanings":[{"pos":"phrase","definition":"used to present the first of two contrasting points","translation":"một mặt"}],"examples":[{"sentence":"On the one hand, the plan cuts costs; on the other, it slows hiring.","translation":"Một mặt, kế hoạch cắt giảm chi phí; mặt khác, nó làm chậm tuyển dụng."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"for-one-thing","term":"for one thing","ipa":"/fɔːr wʌn θɪŋ/","meanings":[{"pos":"phrase","definition":"used to introduce the first of several reasons","translation":"trước hết là"}],"examples":[{"sentence":"For one thing, the current system is too slow at peak hours.","translation":"Trước hết, hệ thống hiện tại quá chậm vào giờ cao điểm."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"to-sum-up","term":"to sum up","ipa":"/tuː sʌm ʌp/","meanings":[{"pos":"phrase","definition":"used before a short final statement","translation":"tóm lại"}],"examples":[{"sentence":"To sum up, the benefits clearly outweigh the risks.","translation":"Tóm lại, lợi ích rõ ràng lớn hơn rủi ro."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"take-everything-into-account","term":"take everything into account","ipa":"/teɪk ˈɛvriθɪŋ ˈɪntuː əˈkaʊnt/","meanings":[{"pos":"phrase","definition":"to consider all relevant factors","translation":"cân nhắc mọi yếu tố"}],"examples":[{"sentence":"Taking everything into account, I recommend option B.","translation":"Cân nhắc mọi yếu tố, tôi đề xuất phương án B."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-in-favor-of","term":"be in favor of","ipa":"/biː ɪn ˈfeɪvər əv/","meanings":[{"pos":"phrase","definition":"to support an idea or plan","translation":"ủng hộ"}],"examples":[{"sentence":"Most of the department is in favor of the flexible schedule.","translation":"Phần lớn phòng ban ủng hộ lịch làm việc linh hoạt."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"address-the-issue","term":"address the issue","ipa":"/əˈdrɛs ði ˈɪʃuː/","meanings":[{"pos":"phrase","definition":"to deal with a problem","translation":"giải quyết vấn đề"}],"examples":[{"sentence":"We need a clear plan to address the issue before the launch.","translation":"Chúng ta cần kế hoạch rõ ràng để giải quyết vấn đề trước khi ra mắt."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"come-to-a-decision","term":"come to a decision","ipa":"/kʌm tuː ə dɪˈsɪʒn/","meanings":[{"pos":"phrase","definition":"to decide after considering something","translation":"đi đến quyết định"}],"examples":[{"sentence":"The committee will come to a decision by the end of the week.","translation":"Uỷ ban sẽ đi đến quyết định vào cuối tuần."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"weigh-the-pros-and-cons","term":"weigh the pros and cons","ipa":"/weɪ ðə proʊz ənd kɒnz/","meanings":[{"pos":"phrase","definition":"to compare advantages and disadvantages","translation":"cân nhắc lợi hại"}],"examples":[{"sentence":"Let’s weigh the pros and cons before committing the budget.","translation":"Hãy cân nhắc lợi hại trước khi rót ngân sách."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"make-a-compelling-case","term":"make a compelling case","ipa":"/meɪk ə kəmˈpɛlɪŋ keɪs/","meanings":[{"pos":"phrase","definition":"to give strong reasons that persuade people","translation":"lập luận thuyết phục"}],"examples":[{"sentence":"The proposal makes a compelling case for expanding overseas.","translation":"Đề xuất lập luận thuyết phục cho việc mở rộng ra nước ngoài."}],"context":"General Business","skill":"collocation","difficulty":5},{"id":"from-my-point-of-view","term":"from my point of view","ipa":"/frəm maɪ pɔɪnt əv vjuː/","meanings":[{"pos":"phrase","definition":"according to the way I see it","translation":"theo quan điểm của tôi"}],"examples":[{"sentence":"From my point of view, customer feedback should drive the roadmap.","translation":"Theo quan điểm của tôi, phản hồi khách hàng nên định hướng lộ trình."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"be-worth-considering","term":"be worth considering","ipa":"/biː wɜːrθ kənˈsɪdərɪŋ/","meanings":[{"pos":"phrase","definition":"to deserve thought as an option","translation":"đáng để cân nhắc"}],"examples":[{"sentence":"Outsourcing the help desk is worth considering next year.","translation":"Thuê ngoài bộ phận hỗ trợ đáng để cân nhắc trong năm tới."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"have-a-significant-impact-on","term":"have a significant impact on","ipa":"/hæv ə sɪɡˈnɪfɪkənt ˈɪmpækt ɒn/","meanings":[{"pos":"phrase","definition":"to strongly affect something","translation":"tác động đáng kể đến"}],"examples":[{"sentence":"The new tax rules will have a significant impact on small exporters.","translation":"Quy định thuế mới sẽ tác động đáng kể đến các nhà xuất khẩu nhỏ."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"play-a-key-role-in","term":"play a key role in","ipa":"/pleɪ ə kiː roʊl ɪn/","meanings":[{"pos":"phrase","definition":"to be very important in a process","translation":"đóng vai trò then chốt trong"}],"examples":[{"sentence":"Automation plays a key role in keeping costs down.","translation":"Tự động hoá đóng vai trò then chốt trong việc giữ chi phí thấp."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"in-the-long-run","term":"in the long run","ipa":"/ɪn ðə lɒŋ rʌn/","meanings":[{"pos":"phrase","definition":"over a long period in the future","translation":"về lâu dài"}],"examples":[{"sentence":"Hiring senior staff costs more but saves money in the long run.","translation":"Tuyển nhân sự cấp cao tốn kém hơn nhưng tiết kiệm về lâu dài."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"a-growing-number-of","term":"a growing number of","ipa":"/ə ˈɡroʊɪŋ ˈnʌmbər əv/","meanings":[{"pos":"phrase","definition":"an increasing quantity of people or things","translation":"ngày càng nhiều"}],"examples":[{"sentence":"A growing number of firms now offer four-day weeks.","translation":"Ngày càng nhiều công ty nay áp dụng tuần bốn ngày."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"there-is-no-doubt-that","term":"there is no doubt that","ipa":"/ðɛər ɪz noʊ daʊt ðæt/","meanings":[{"pos":"phrase","definition":"used to state something you are certain about","translation":"không nghi ngờ gì rằng"}],"examples":[{"sentence":"There is no doubt that the redesign improved usability.","translation":"Không nghi ngờ gì rằng việc thiết kế lại đã cải thiện khả năng sử dụng."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-committed-to","term":"be committed to","ipa":"/biː kəˈmɪtɪd tuː/","meanings":[{"pos":"phrase","definition":"to be dedicated to a goal or activity","translation":"cam kết, tận tâm với"}],"examples":[{"sentence":"The company is committed to reducing packaging waste by half.","translation":"Công ty cam kết giảm một nửa rác thải bao bì."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"take-responsibility-for","term":"take responsibility for","ipa":"/teɪk rɪˌspɒnsəˈbɪləti fɔːr/","meanings":[{"pos":"phrase","definition":"to accept that you caused something or must deal with it","translation":"chịu trách nhiệm về"}],"examples":[{"sentence":"Our team takes full responsibility for the delayed release.","translation":"Nhóm chúng tôi hoàn toàn chịu trách nhiệm về việc phát hành chậm."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"reach-out-to","term":"reach out to","ipa":"/riːtʃ aʊt tuː/","meanings":[{"pos":"phrasal v.","definition":"to contact someone, often to offer or ask for help","translation":"liên hệ, chủ động tiếp cận"}],"examples":[{"sentence":"Please reach out to the vendor if the parts are still missing.","translation":"Vui lòng liên hệ nhà cung cấp nếu vẫn thiếu linh kiện."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"circle-back","term":"circle back","ipa":"/ˈsɜːrkl bæk/","meanings":[{"pos":"phrase","definition":"to return to a topic later","translation":"quay lại vấn đề sau"}],"examples":[{"sentence":"Let’s circle back to the budget question after the demo.","translation":"Hãy quay lại câu hỏi ngân sách sau phần demo."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"run-something-by-someone","term":"run something by someone","ipa":"/rʌn ˈsʌmθɪŋ baɪ ˈsʌmwʌn/","meanings":[{"pos":"phrase","definition":"to tell someone about a plan to get their opinion","translation":"hỏi ý ai đó về việc gì"}],"examples":[{"sentence":"I want to run the new layout by the design lead first.","translation":"Tôi muốn hỏi ý trưởng nhóm thiết kế về bố cục mới trước."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-on-track","term":"be on track","ipa":"/biː ɒn træk/","meanings":[{"pos":"phrase","definition":"progressing as planned toward a goal","translation":"đúng tiến độ"}],"examples":[{"sentence":"The rollout is on track to finish by the end of the month.","translation":"Việc triển khai đúng tiến độ để hoàn thành vào cuối tháng."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"fall-short-of","term":"fall short of","ipa":"/fɔːl ʃɔːrt əv/","meanings":[{"pos":"phrase","definition":"to fail to reach a standard or target","translation":"không đạt, thiếu hụt so với"}],"examples":[{"sentence":"Q2 results fell short of the revenue target by 6 percent.","translation":"Kết quả quý 2 thiếu 6 phần trăm so với chỉ tiêu doanh thu."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"meet-expectations","term":"meet expectations","ipa":"/miːt ˌɛkspɛkˈteɪʃnz/","meanings":[{"pos":"phrase","definition":"to be as good as people hoped","translation":"đáp ứng kỳ vọng"}],"examples":[{"sentence":"The prototype met expectations in the first round of testing.","translation":"Nguyên mẫu đáp ứng kỳ vọng trong vòng thử nghiệm đầu tiên."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"go-the-extra-mile","term":"go the extra mile","ipa":"/ɡoʊ ði ˈɛkstrə maɪl/","meanings":[{"pos":"phrase","definition":"to make more effort than is expected","translation":"nỗ lực hơn mức mong đợi"}],"examples":[{"sentence":"The support team went the extra mile to fix it overnight.","translation":"Đội hỗ trợ đã nỗ lực hơn mức mong đợi để sửa nó trong đêm."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-up-for-discussion","term":"be up for discussion","ipa":"/biː ʌp fɔːr dɪˈskʌʃn/","meanings":[{"pos":"phrase","definition":"available to be talked about and possibly changed","translation":"có thể đưa ra bàn bạc"}],"examples":[{"sentence":"The timeline is fixed, but the scope is up for discussion.","translation":"Mốc thời gian đã cố định, nhưng phạm vi có thể bàn bạc."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"in-response-to","term":"in response to","ipa":"/ɪn rɪˈspɒns tuː/","meanings":[{"pos":"phrase","definition":"as a reaction to something","translation":"để đáp lại, nhằm phản hồi"}],"examples":[{"sentence":"In response to customer feedback, we extended the return window.","translation":"Để đáp lại phản hồi khách hàng, chúng tôi kéo dài thời gian đổi trả."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"with-respect-to","term":"with respect to","ipa":"/wɪð rɪˈspɛkt tuː/","meanings":[{"pos":"phrase","definition":"concerning a particular thing","translation":"về vấn đề, đối với"}],"examples":[{"sentence":"With respect to staffing, we plan to hire two analysts.","translation":"Về nhân sự, chúng tôi dự định tuyển hai chuyên viên phân tích."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"be-aimed-at","term":"be aimed at","ipa":"/biː eɪmd æt/","meanings":[{"pos":"phrase","definition":"intended for a particular group or purpose","translation":"nhắm đến, hướng tới"}],"examples":[{"sentence":"The campaign is aimed at first-time buyers.","translation":"Chiến dịch nhắm đến người mua lần đầu."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"take-into-consideration","term":"take into consideration","ipa":"/teɪk ˈɪntuː kənˌsɪdəˈreɪʃn/","meanings":[{"pos":"phrase","definition":"to think about something when making a decision","translation":"xem xét đến, tính đến"}],"examples":[{"sentence":"We took shipping time into consideration when setting the deadline.","translation":"Chúng tôi đã tính đến thời gian vận chuyển khi đặt hạn chót."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"be-geared-toward","term":"be geared toward","ipa":"/biː ɡɪərd təˈwɔːrd/","meanings":[{"pos":"phrase","definition":"designed or organized for a particular purpose","translation":"được thiết kế hướng tới"}],"examples":[{"sentence":"The training is geared toward new team leads.","translation":"Khoá đào tạo được thiết kế hướng tới các trưởng nhóm mới."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"a-wide-range-of","term":"a wide range of","ipa":"/ə waɪd reɪndʒ əv/","meanings":[{"pos":"phrase","definition":"many different types of something","translation":"nhiều loại, đa dạng"}],"examples":[{"sentence":"The platform supports a wide range of payment methods.","translation":"Nền tảng hỗ trợ nhiều phương thức thanh toán."}],"context":"General Business","skill":"collocation","difficulty":2},{"id":"to-a-certain-extent","term":"to a certain extent","ipa":"/tuː ə ˈsɜːrtn ɪkˈstɛnt/","meanings":[{"pos":"phrase","definition":"partly but not completely","translation":"ở một mức độ nào đó"}],"examples":[{"sentence":"To a certain extent, the delay was outside our control.","translation":"Ở một mức độ nào đó, sự chậm trễ nằm ngoài tầm kiểm soát của chúng tôi."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-inclined-to","term":"be inclined to","ipa":"/biː ɪnˈklaɪnd tuː/","meanings":[{"pos":"phrase","definition":"to tend to think or act in a certain way","translation":"có xu hướng, nghiêng về"}],"examples":[{"sentence":"I’m inclined to postpone the launch until testing is complete.","translation":"Tôi nghiêng về việc hoãn ra mắt cho đến khi thử nghiệm xong."}],"context":"General Business","skill":"vocab","difficulty":5},{"id":"in-light-of","term":"in light of","ipa":"/ɪn laɪt əv/","meanings":[{"pos":"phrase","definition":"because of; considering","translation":"xét đến, do bởi"}],"examples":[{"sentence":"In light of the strong demand, we added a second production run.","translation":"Xét đến nhu cầu lớn, chúng tôi bổ sung đợt sản xuất thứ hai."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"as-far-as-i-am-concerned","term":"as far as I am concerned","ipa":"/æz fɑːr æz aɪ æm kənˈsɜːrnd/","meanings":[{"pos":"phrase","definition":"in my personal opinion","translation":"về phần tôi thì"}],"examples":[{"sentence":"As far as I am concerned, the proposal is ready to submit.","translation":"Về phần tôi thì đề xuất đã sẵn sàng để nộp."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"put-it-simply","term":"put it simply","ipa":"/pʊt ɪt ˈsɪmpli/","meanings":[{"pos":"phrase","definition":"to explain something in an easy-to-understand way","translation":"nói đơn giản là"}],"examples":[{"sentence":"To put it simply, we spend more than we earn on that product.","translation":"Nói đơn giản là chúng ta chi nhiều hơn thu với sản phẩm đó."}],"context":"General Business","skill":"vocab","difficulty":3},{"id":"the-bottom-line-is","term":"the bottom line is","ipa":"/ðə ˈbɒtəm laɪn ɪz/","meanings":[{"pos":"phrase","definition":"the most important fact to consider","translation":"điều cốt lõi là"}],"examples":[{"sentence":"The bottom line is that we need two more weeks to test properly.","translation":"Điều cốt lõi là chúng ta cần thêm hai tuần để thử nghiệm cho đúng."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"be-beneficial-to","term":"be beneficial to","ipa":"/biː ˌbɛnɪˈfɪʃl tuː/","meanings":[{"pos":"phrase","definition":"to be helpful or good for someone","translation":"có lợi cho"}],"examples":[{"sentence":"Cross-training would be beneficial to the whole department.","translation":"Đào tạo chéo sẽ có lợi cho cả phòng ban."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"stem-from","term":"stem from","ipa":"/stɛm frɒm/","meanings":[{"pos":"phrasal v.","definition":"to be caused by something","translation":"bắt nguồn từ"}],"examples":[{"sentence":"Most complaints stem from the confusing return process.","translation":"Phần lớn khiếu nại bắt nguồn từ quy trình đổi trả khó hiểu."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"lay-out","term":"lay out","ipa":"/leɪ aʊt/","meanings":[{"pos":"phrasal v.","definition":"to explain something clearly and in detail","translation":"trình bày, phác ra"}],"examples":[{"sentence":"The memo lays out the three phases of the migration.","translation":"Bản ghi nhớ trình bày ba giai đoạn của việc chuyển đổi."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"in-conclusion","term":"in conclusion","ipa":"/ɪn kənˈkluːʒn/","meanings":[{"pos":"phrase","definition":"used to introduce the final part of a speech or essay","translation":"kết luận lại"}],"examples":[{"sentence":"In conclusion, a phased rollout carries the least risk.","translation":"Kết luận lại, triển khai theo giai đoạn có ít rủi ro nhất."}],"context":"General Business","skill":"vocab","difficulty":2},{"id":"reach-an-agreement","term":"reach an agreement","ipa":"/riːtʃ ən əˈɡriːmənt/","meanings":[{"pos":"phrase","definition":"to succeed in making a deal","translation":"đạt được thoả thuận"}],"examples":[{"sentence":"Both sides reached an agreement after a week of talks.","translation":"Hai bên đạt được thoả thuận sau một tuần đàm phán."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"fill-a-position","term":"fill a position","ipa":"/fɪl ə pəˈzɪʃn/","meanings":[{"pos":"phrase","definition":"to find a person for a job vacancy","translation":"tuyển được người cho vị trí"}],"examples":[{"sentence":"HR hopes to fill the analyst position by the end of the month.","translation":"Phòng nhân sự hy vọng tuyển được người cho vị trí phân tích viên vào cuối tháng."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"conduct-a-survey","term":"conduct a survey","ipa":"/kənˈdʌkt ə ˈsɜːrveɪ/","meanings":[{"pos":"phrase","definition":"to carry out a study of people’s opinions","translation":"tiến hành khảo sát"}],"examples":[{"sentence":"The firm conducts a customer survey every six months.","translation":"Công ty tiến hành khảo sát khách hàng sáu tháng một lần."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"implement-a-policy","term":"implement a policy","ipa":"/ˈɪmplɪmɛnt ə ˈpɒləsi/","meanings":[{"pos":"phrase","definition":"to put a rule or plan into effect","translation":"triển khai một chính sách"}],"examples":[{"sentence":"The company implemented a new travel policy in January.","translation":"Công ty triển khai chính sách công tác mới vào tháng Một."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"address-concerns","term":"address concerns","ipa":"/əˈdrɛs kənˈsɜːrnz/","meanings":[{"pos":"phrase","definition":"to deal with the worries people have","translation":"giải quyết các lo ngại"}],"examples":[{"sentence":"The Q&A session is a chance to address employee concerns.","translation":"Phiên hỏi đáp là dịp để giải quyết các lo ngại của nhân viên."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"raise-awareness","term":"raise awareness","ipa":"/reɪz əˈwɛərnəs/","meanings":[{"pos":"phrase","definition":"to make more people know about something","translation":"nâng cao nhận thức"}],"examples":[{"sentence":"The campaign aims to raise awareness of recycling options.","translation":"Chiến dịch nhằm nâng cao nhận thức về các lựa chọn tái chế."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"gain-access-to","term":"gain access to","ipa":"/ɡeɪn ˈæksɛs tuː/","meanings":[{"pos":"phrase","definition":"to obtain the right or ability to use something","translation":"được quyền truy cập/tiếp cận"}],"examples":[{"sentence":"New staff gain access to the shared drive on their first day.","translation":"Nhân viên mới được quyền truy cập ổ đĩa chung trong ngày đầu."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"take-effect","term":"take effect","ipa":"/teɪk ɪˈfɛkt/","meanings":[{"pos":"phrase","definition":"to begin to apply or operate","translation":"có hiệu lực"}],"examples":[{"sentence":"The revised rates take effect on the first of next month.","translation":"Mức giá điều chỉnh có hiệu lực vào ngày đầu tháng sau."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"meet-a-requirement","term":"meet a requirement","ipa":"/miːt ə rɪˈkwaɪərmənt/","meanings":[{"pos":"phrase","definition":"to satisfy a necessary condition","translation":"đáp ứng yêu cầu"}],"examples":[{"sentence":"The supplier failed to meet the certification requirement.","translation":"Nhà cung cấp không đáp ứng yêu cầu chứng nhận."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"pose-a-risk","term":"pose a risk","ipa":"/poʊz ə rɪsk/","meanings":[{"pos":"phrase","definition":"to be a possible source of danger","translation":"gây ra rủi ro"}],"examples":[{"sentence":"Storing passwords in plain text poses a serious security risk.","translation":"Lưu mật khẩu dạng văn bản thuần gây ra rủi ro bảo mật nghiêm trọng."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"take-precautions","term":"take precautions","ipa":"/teɪk prɪˈkɔːʃnz/","meanings":[{"pos":"phrase","definition":"to do things to prevent harm in advance","translation":"đề phòng, thực hiện biện pháp phòng ngừa"}],"examples":[{"sentence":"Staff took precautions by backing up the database before the update.","translation":"Nhân viên đề phòng bằng cách sao lưu cơ sở dữ liệu trước khi cập nhật."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"reach-a-milestone","term":"reach a milestone","ipa":"/riːtʃ ə ˈmaɪlstoʊn/","meanings":[{"pos":"phrase","definition":"to arrive at an important point in a project","translation":"đạt một mốc quan trọng"}],"examples":[{"sentence":"The project reached a major milestone with the beta release.","translation":"Dự án đạt một mốc quan trọng với bản beta."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"issue-a-refund","term":"issue a refund","ipa":"/ˈɪʃuː ə ˈriːfʌnd/","meanings":[{"pos":"phrase","definition":"to formally give money back to a customer","translation":"hoàn tiền"}],"examples":[{"sentence":"We will issue a refund within three business days.","translation":"Chúng tôi sẽ hoàn tiền trong ba ngày làm việc."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"exceed-expectations","term":"exceed expectations","ipa":"/ɪkˈsiːd ˌɛkspɛkˈteɪʃnz/","meanings":[{"pos":"phrase","definition":"to be better than what people hoped for","translation":"vượt kỳ vọng"}],"examples":[{"sentence":"Attendance at the launch exceeded expectations by a wide margin.","translation":"Lượng người dự lễ ra mắt vượt kỳ vọng rất nhiều."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"undergo-a-review","term":"undergo a review","ipa":"/ˌʌndərˈɡoʊ ə rɪˈvjuː/","meanings":[{"pos":"phrase","definition":"to be formally examined or assessed","translation":"được rà soát, kiểm tra"}],"examples":[{"sentence":"All vendor contracts undergo a review every two years.","translation":"Mọi hợp đồng nhà cung cấp được rà soát hai năm một lần."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"a-viable-option","term":"a viable option","ipa":"/ə ˈvaɪəbl ˈɒpʃn/","meanings":[{"pos":"phrase","definition":"a choice that could realistically work","translation":"một phương án khả thi"}],"examples":[{"sentence":"Leasing equipment is a viable option for the first year.","translation":"Thuê thiết bị là một phương án khả thi cho năm đầu."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"a-steady-increase","term":"a steady increase","ipa":"/ə ˈstɛdi ˈɪnkriːs/","meanings":[{"pos":"phrase","definition":"a slow, continuous rise","translation":"sự tăng đều đặn"}],"examples":[ ng các tiêu chí"}],"examples":[{"sentence":"Only two proposals met all of the evaluation criteria.","translation":"Chỉ hai đề xuất đáp ứng toàn bộ tiêu chí đánh giá."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"bring-to-someone-s-attention","term":"bring to someone’s attention","ipa":"/brɪŋ tuː ˈsʌmwʌnz əˈtɛnʃn/","meanings":[{"pos":"phrase","definition":"to make someone aware of something","translation":"lưu ý ai đó về việc gì"}],"examples":[{"sentence":"Thank you for bringing the billing error to our attention.","translation":"Cảm ơn đã lưu ý chúng tôi về lỗi tính phí."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"take-measures","term":"take measures","ipa":"/teɪk ˈmɛʒərz/","meanings":[{"pos":"phrase","definition":"to take official action to deal with a problem","translation":"thực hiện biện pháp"}],"examples":[{"sentence":"The city took measures to ease traffic near the new stadium.","translation":"Thành phố thực hiện biện pháp giảm ùn tắc gần sân vận động mới."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"give-priority-to","term":"give priority to","ipa":"/ɡɪv praɪˈɒrəti tuː/","meanings":[{"pos":"phrase","definition":"to treat something as more important than other things","translation":"ưu tiên cho"}],"examples":[{"sentence":"The team gives priority to bugs that block customer payments.","translation":"Nhóm ưu tiên các lỗi chặn việc thanh toán của khách hàng."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"carry-out-an-inspection","term":"carry out an inspection","ipa":"/ˈkæri aʊt ən ɪnˈspɛkʃn/","meanings":[{"pos":"phrase","definition":"to perform an official examination","translation":"tiến hành kiểm tra"}],"examples":[{"sentence":"Inspectors will carry out an inspection of the kitchen next week.","translation":"Thanh tra sẽ tiến hành kiểm tra khu bếp vào tuần tới."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"reach-capacity","term":"reach capacity" vl/","meanings":[{"pos":"phrase","definition":"needing official permission before it can happen","translation":"cần được phê duyệt"}],"examples":[{"sentence":"All expenses over 500 dollars are subject to approval.","translation":"Mọi khoản chi trên 500 đô la cần được phê duyệt."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"meet-halfway","term":"meet halfway","ipa":"/miːt ˌhɑːfˈweɪ/","meanings":[{"pos":"phrase","definition":"to compromise so both sides give up something","translation":"nhượng bộ để gặp nhau ở giữa"}],"examples":[{"sentence":"The two teams met halfway on the delivery date.","translation":"Hai nhóm nhượng bộ để thống nhất ngày giao hàng."}],"context":"General Business","skill":"collocation","difficulty":4}];

/* ---------- storage ---------- */
const KEY = 'toeic-flashcards-html';
const RATES = [0.25,0.5,0.75,1,1.25,1.5,1.75,2];
const DEFAULT = { status:{}, order:{}, prefs:{ hideMeaning:false, rate:1 }, daily:{} };

function load(){
  try{
    const p = JSON.parse(localStorage.getItem(KEY)) || {};
    return {
      status: p.status||{}, order: p.order||{},
      prefs: Object.assign({}, DEFAULT.prefs, p.prefs),
      daily: p.daily||{},
    };
  }catch(e){ return structuredClone(DEFAULT); }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayKey(d){ return (d||new Date()).toISOString().slice(0,10); }
function recordDaily(id){
  const k = todayKey();
  const set = new Set(S.daily[k]||[]);
  set.add(id);
  S.daily[k] = [...set];
}
function streak(){
  const days = new Set(Object.keys(S.daily).filter(d => (S.daily[d]||[]).length));
  if(!days.size) return 0;
  const cur = new Date();
  if(!days.has(todayKey(cur))) cur.setDate(cur.getDate()-1);
  let n = 0;
  while(days.has(todayKey(cur))){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function setStatus(id, st){ S.status[id] = st; recordDaily(id); save(); }

/* ---------- decks ---------- */
const CONTEXTS = [
  ['Part 5','Part 5 · Câu chưa hoàn chỉnh','Từ vựng & word form cho Part 5'],
  ['Part 6','Part 6 · Đoạn văn','Từ nối, mạch logic đoạn văn'],
  ['Part 7','Part 7 · Đọc hiểu','Từ vựng email, thông báo, bài báo'],
  ['Listening Part 3','Listening Part 3 · Hội thoại','Từ vựng hội thoại công sở'],
  ['Listening Part 4','Listening Part 4 · Bài nói','Từ vựng thông báo, bản tin'],
  ['General Business','Speaking & Writing · Business','Từ vựng dùng khi nói và viết'],
];
function mkDecks(){
  const d = [];
  d.push({ slug:'hard', name:'Bẫy khó · Band 900+', blurb:'near-synonym & collocation (độ khó 4–5)',
    ids: WORD_BANK.filter(w=>w.difficulty>=4).map(w=>w.id) });
  d.push({ slug:'core', name:'Nền tảng · 700+', blurb:'Từ độ khó vừa (độ khó 2–3)',
    ids: WORD_BANK.filter(w=>w.difficulty>=2&&w.difficulty<=3).map(w=>w.id) });
  for(const [ctx,name,blurb] of CONTEXTS){
    d.push({ slug: ctx.toLowerCase().replace(/[^a-z0-9]+/g,'-'), name, blurb,
      ids: WORD_BANK.filter(w=>w.context===ctx).map(w=>w.id) });
  }
  d.push({ slug:'all', name:'Toàn bộ từ vựng', blurb:'Học tuần tự cả ngân hàng',
    ids: WORD_BANK.map(w=>w.id) });
  return d.filter(x=>x.ids.length);
}
const DECKS = mkDecks();
const WORD = Object.fromEntries(WORD_BANK.map(w=>[w.id,w]));

function counts(ids){
  let known=0, unknown=0;
  for(const id of ids){
    const s = S.status[id];
    if(s==='known') known++; else if(s==='unknown') unknown++;
  }
  return { total:ids.length, known, unknown, unseen:ids.length-known-unknown };
}
function filterIds(ids, f){
  if(f==='all') return ids.slice();
  if(f==='unseen') return ids.filter(id=>!S.status[id]);
  return ids.filter(id=>S.status[id]===f);
}
function shuffle(a){
  const c = a.slice();
  for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
  return c;
}
function speak(text, rate){
  if(!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = Math.min(2, Math.max(0.25, rate||1));
  speechSynthesis.speak(u);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- view state ---------- */
let view = { screen:'picker' };

function render(){
  document.getElementById('streak').textContent = streak()>0 ? '🔥 '+streak()+' ngày' : '';
  const app = document.getElementById('app');
  if(view.screen==='deck') renderDeck(app);
  else renderPicker(app);
}

function renderPicker(app){
  const all = DECKS.find(d=>d.slug==='all');
  const c = counts(all.ids);
  app.innerHTML = `
    <p class="eyebrow">HSK-STYLE · BAND 900+</p>
    <p class="sub">Đã nhớ <b>${c.known}</b> / ${c.total} từ. Chọn bộ để học — vuốt phải / bấm
      <b>Đã nhớ</b> nếu nhớ, vuốt trái / <b>Chưa nhớ</b> nếu chưa.</p>
    <div class="decks">
      ${DECKS.map(d=>{
        const dc = counts(d.ids);
        const pct = dc.total ? Math.round(dc.known/dc.total*100) : 0;
        return `<button class="deck" data-slug="${d.slug}">
          <b>${esc(d.name)}</b>
          <small>${esc(d.blurb)}</small>
          <div class="count">${d.ids.length} từ</div>
          <div class="mini"><i style="width:${pct}%"></i></div>
          <div class="known">Đã nhớ ${dc.known} / ${dc.total}</div>
        </button>`;
      }).join('')}
    </div>`;
  app.querySelectorAll('.deck').forEach(b=>{
    b.onclick = ()=>{ view = { screen:'deck', slug:b.dataset.slug, tab:'cards',
      filter:'all', jumpId:null, idx:0, revealed:false, order:null, showUnknown:false }; render(); };
  });
}

function currentOrder(deck){
  if(view.order) return view.order;
  const saved = S.order[view.slug];
  if(saved && saved.length===deck.ids.length){
    return saved.map(i=>deck.ids[i]).filter(Boolean);
  }
  return deck.ids.slice();
}

function renderDeck(app){
  const deck = DECKS.find(d=>d.slug===view.slug);
  const c = counts(deck.ids);
  const order = currentOrder(deck);
  const list = view.jumpId ? [view.jumpId] : filterIds(order, view.filter);
  const cur = list.length ? WORD[list[view.idx % list.length]] : null;
  const pos = list.length ? (view.idx % list.length) + 1 : 0;

  app.innerHTML = `
    <button class="back" id="back">← Chọn bộ khác</button>
    <h2 class="deck-title">${esc(deck.name)}</h2>
    <div class="tabs">
      <button class="tab ${view.tab==='cards'?'active':''}" data-tab="cards">🗂 Học flashcard</button>
      <button class="tab ${view.tab==='overview'?'active':''}" data-tab="overview">📋 Tổng quan</button>
    </div>
    ${view.tab==='overview' ? overviewHTML(deck) : `
      <div class="statgrid">
        <div><b>${c.total}</b><small>tổng</small></div>
        <div><b style="color:var(--red)">${c.unknown}</b><small>chưa nhớ</small></div>
        <div><b style="color:var(--green)">${c.known}</b><small>đã nhớ</small></div>
        <div><b style="color:var(--muted)">${c.unseen}</b><small>chưa học</small></div>
      </div>
      <div class="filters">
        ${['all','unknown','known','unseen'].map(f=>{
          const lbl = {all:'Tất cả',unknown:'Chưa nhớ',known:'Đã nhớ',unseen:'Chưa học'}[f];
          return `<button class="chip ${view.filter===f&&!view.jumpId?'active':''}" data-filter="${f}">${lbl}</button>`;
        }).join('')}
      </div>
      <div class="rate">
        Tốc độ đọc ví dụ
        <select id="rate">${RATES.map(r=>`<option value="${r}" ${r===S.prefs.rate?'selected':''}>${r}x</option>`).join('')}</select>
      </div>
      <div class="tools">
        <button class="chip" id="shuffle">🔀 Xáo trộn</button>
        <button class="chip ${S.prefs.hideMeaning?'on':''}" id="hide">${S.prefs.hideMeaning?'🙈 Đang ẩn nghĩa':'👁 Đang hiện nghĩa'}</button>
        <button class="chip" id="reset">↻ Học lại từ đầu</button>
      </div>
      ${cur ? `
        <p class="progress">${pos} / ${list.length}</p>
        <div class="pbar"><i style="width:${list.length?pos/list.length*100:0}%"></i></div>
        ${cardHTML(cur)}
        <div class="grade">
          <button class="g-no" id="g-no">Chưa nhớ</button>
          <button class="g-yes" id="g-yes">Đã nhớ</button>
        </div>
        <button class="link" id="toggle-unknown">${view.showUnknown?'Ẩn từ chưa nhớ':'Hiển thị từ chưa nhớ'}</button>
        ${view.showUnknown ? unknownListHTML(deck) : ''}
      ` : `<div class="empty">Không có từ trong bộ lọc này.<br>Đổi bộ lọc hoặc bấm "Học lại từ đầu".</div>`}
    `}
  `;

  app.querySelector('#back').onclick = ()=>{ view = { screen:'picker' }; render(); };
  app.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ view.tab = b.dataset.tab; view.jumpId=null; render(); };
  });

  if(view.tab==='overview'){ wireOverview(app, deck); return; }

  app.querySelectorAll('.chip[data-filter]').forEach(b=>{
    b.onclick = ()=>{ view.filter=b.dataset.filter; view.jumpId=null; view.idx=0; view.revealed=false; render(); };
  });
  const rateSel = app.querySelector('#rate');
  if(rateSel) rateSel.onchange = ()=>{ S.prefs.rate = Number(rateSel.value); save(); };
  app.querySelector('#shuffle').onclick = ()=>{
    const sh = shuffle(deck.ids);
    view.order = sh; view.idx = 0; view.revealed = false;
    const map = new Map(deck.ids.map((id,i)=>[id,i]));
    S.order[view.slug] = sh.map(id=>map.get(id)); save();
    render();
  };
  app.querySelector('#hide').onclick = ()=>{ S.prefs.hideMeaning = !S.prefs.hideMeaning; save(); render(); };
  app.querySelector('#reset').onclick = ()=>{
    if(!confirm(`Học lại từ đầu bộ "${deck.name}"? Trạng thái đã nhớ/chưa nhớ của bộ này sẽ bị xoá.`)) return;
    for(const id of deck.ids) delete S.status[id];
    delete S.order[view.slug];
    save();
    view.order=null; view.idx=0; view.revealed=false; render();
  };

  const card = app.querySelector('.card');
  if(card){
    wireCard(card, cur);
    app.querySelector('#g-no').onclick = ()=>grade(false, cur, deck);
    app.querySelector('#g-yes').onclick = ()=>grade(true, cur, deck);
    const tu = app.querySelector('#toggle-unknown');
    if(tu) tu.onclick = ()=>{ view.showUnknown = !view.showUnknown; render(); };
  }
}

function cardHTML(w){
  const back = view.revealed;
  const pips = '●'.repeat(w.difficulty) + '○'.repeat(5-w.difficulty);
  return `<div class="card">
    <div class="head">
      <div>
        <p class="term">${esc(w.term)}</p>
        ${w.ipa && !S.prefs.hideMeaning ? `<p class="ipa">${esc(w.ipa)}</p>` : ''}
      </div>
      <div class="meta">
        <button class="sound" data-say="${esc(w.term)}">🔊</button>
        <span class="tag">${esc(w.context)}</span>
        <span class="diff">độ khó ${pips}</span>
      </div>
    </div>
    ${back ? `<div class="back-body">
      ${w.meanings.map(m=>`<div class="mean">
        <b>${esc(m.pos)}</b> <span class="def">${esc(m.definition)}</span>
        ${m.translation?`<div class="tr">${esc(m.translation)}</div>`:''}
      </div>`).join('')}
      ${w.examples.map(e=>`<div class="ex">
        <div class="row">
          <span class="en">${esc(e.sentence)}</span>
          <button class="sound" data-say="${esc(e.sentence)}" data-ex="1">🔊</button>
        </div>
        ${e.translation?`<div class="tr">${esc(e.translation)}</div>`:''}
      </div>`).join('')}
    </div>` : `<p class="hint">Nhấn / phím Space để xem nghĩa · phím 1 = chưa nhớ · 2 = đã nhớ</p>`}
  </div>`;
}

function unknownListHTML(deck){
  const rows = deck.ids.filter(id=>S.status[id]==='unknown').map(id=>WORD[id]).filter(Boolean);
  if(!rows.length) return `<div class="unknown-list">Chưa có từ nào đánh dấu "Chưa nhớ".</div>`;
  return `<ol class="unknown-list">${rows.map(w=>
    `<li><b>${esc(w.term)}</b>${w.ipa?` <span style="color:var(--muted)">${esc(w.ipa)}</span>`:''} — ${esc(w.meanings[0].translation||w.meanings[0].definition)}</li>`
  ).join('')}</ol>`;
}

function wireCard(card, w){
  card.querySelectorAll('.sound').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); speak(b.dataset.say, b.dataset.ex ? S.prefs.rate : 1); };
  });
  let sx=0, active=false, locked=null, dx=0;
  card.addEventListener('pointerdown', e=>{
    if(e.target.closest('.sound')) return;
    sx=e.clientX; active=true; locked=null; dx=0;
  });
  card.addEventListener('pointermove', e=>{
    if(!active) return;
    dx = e.clientX - sx;
    if(!locked && Math.abs(dx)>8) locked='h';
    if(locked==='h'){ card.setPointerCapture(e.pointerId); card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`; }
  });
  card.addEventListener('pointerup', ()=>{
    if(!active) return; active=false;
    card.style.transform='';
    if(locked!=='h'){ view.revealed=!view.revealed; render(); return; }
    if(Math.abs(dx)>=90) gradeCurrent(dx>0);
  });
  card.addEventListener('pointercancel', ()=>{ active=false; card.style.transform=''; });
}

function gradeCurrent(known){
  const deck = DECKS.find(d=>d.slug===view.slug);
  const order = currentOrder(deck);
  const list = view.jumpId ? [view.jumpId] : filterIds(order, view.filter);
  const cur = list.length ? WORD[list[view.idx % list.length]] : null;
  grade(known, cur, deck);
}

function grade(known, w, deck){
  if(!w) return;
  setStatus(w.id, known ? 'known' : 'unknown');
  if(known && counts(deck.ids).known === deck.ids.length){
    showCelebration(deck);
  }
  view.revealed = false;
  view.jumpId = null;
  view.idx += 1;
  render();
}

/* ---------- overview ---------- */
function overviewHTML(deck){
  return `<div class="ovhead">
    <input id="ov-q" type="search" placeholder="Tìm từ, IPA hoặc nghĩa…" value="${esc(view.ovQ||'')}">
    <select id="ov-status">
      <option value="all">Tất cả trạng thái</option>
      <option value="unseen">Chưa học</option>
      <option value="unknown">Chưa nhớ</option>
      <option value="known">Đã nhớ</option>
    </select>
  </div>
  <div class="ovcount" id="ov-count"></div>
  <div class="ovlist" id="ov-list"></div>`;
}
function wireOverview(app, deck){
  const q = app.querySelector('#ov-q');
  const st = app.querySelector('#ov-status');
  st.value = view.ovStatus || 'all';
  function draw(){
    view.ovQ = q.value; view.ovStatus = st.value;
    const term = q.value.trim().toLowerCase();
    const rows = deck.ids.map(id=>WORD[id]).filter(Boolean).filter(w=>{
      const s = S.status[w.id];
      if(st.value==='unseen' && s) return false;
      if((st.value==='known'||st.value==='unknown') && s!==st.value) return false;
      if(!term) return true;
      const hay = (w.term+' '+(w.ipa||'')+' '+w.meanings.map(m=>m.definition+' '+(m.translation||'')).join(' ')).toLowerCase();
      return hay.includes(term);
    });
    app.querySelector('#ov-count').textContent = rows.length + ' từ';
    app.querySelector('#ov-list').innerHTML = rows.map(w=>{
      const s = S.status[w.id];
      const b = s==='known' ? ['b-known','Đã nhớ'] : s==='unknown' ? ['b-unknown','Chưa nhớ'] : ['b-new','Chưa học'];
      return `<div class="ovrow">
        <button class="sound" data-say="${esc(w.term)}">🔊</button>
        <button class="word" data-id="${w.id}">
          <span class="t">${esc(w.term)}</span>
          ${w.ipa?`<span class="i">${esc(w.ipa)}</span>`:''}
          <span class="m">${esc(w.meanings[0].translation||w.meanings[0].definition)}</span>
        </button>
        <span class="badge ${b[0]}">${b[1]}</span>
      </div>`;
    }).join('');
    app.querySelectorAll('#ov-list .sound').forEach(x=> x.onclick = e=>{ e.stopPropagation(); speak(x.dataset.say,1); });
    app.querySelectorAll('#ov-list .word').forEach(x=>{
      x.onclick = ()=>{ view.jumpId = x.dataset.id; view.filter='all'; view.tab='cards';
        view.idx=0; view.revealed=false; render(); };
    });
  }
  q.oninput = draw;
  st.onchange = draw;
  draw();
}

/* ---------- celebration ---------- */
function showCelebration(deck){
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="cbox">
    <div class="cup">🏆</div>
    <h3>Xuất sắc!</h3>
    <p>Bạn đã nhớ toàn bộ <b>${deck.ids.length}</b> từ trong bộ <b>${esc(deck.name)}</b>.</p>
    <button>Tiếp tục</button>
  </div>`;
  el.onclick = e=>{ if(e.target===el || e.target.tagName==='BUTTON') el.remove(); };
  document.body.appendChild(el);
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e=>{
  if(view.screen!=='deck' || view.tab!=='cards') return;
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); view.revealed=!view.revealed; render(); }
  else if(e.key==='1') gradeCurrent(false);
  else if(e.key==='2') gradeCurrent(true);
});

render();
</script>
</body>
</html>
