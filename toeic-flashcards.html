<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEIC Flashcards</title>
<style>
  :root{
    --bg:#061017;--panel:#0c2029;--panel2:#0a1921;--line:#203943;
    --text:#edf8fa;--muted:#789099;--orange:#ff6428;--cyan:#40d9e7;--green:#50d391;--red:#e0503f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(#07141b,#040c11);color:var(--text);
    font-family:Arial,"Helvetica Neue",sans-serif;min-height:100vh}
  button,select,input{font:inherit}
  .hidden{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px max(16px,calc((100vw - 900px)/2));border-bottom:1px solid #19313a;
    background:#061017e8;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
  header h1{margin:0;font-size:18px;font-style:italic;color:#ff7541}
  header .streak{font-size:12px;font-weight:700;color:#ffc34a}
  main{width:min(900px,calc(100% - 32px));margin:auto;padding:24px 0 64px}
  .eyebrow{margin:0 0 6px;color:#66808a;font-size:9px;font-weight:900;letter-spacing:.2em}
  .sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 18px}

  /* deck picker */
  .decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .deck{border:1px solid var(--line);border-radius:6px;text-align:left;cursor:pointer;
    background:linear-gradient(145deg,#0f222b,#08171e);color:var(--text);padding:14px}
  .deck:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .deck b{display:block;font-size:14px}
  .deck small{display:block;color:#68808a;font-size:10px;margin-top:3px;line-height:1.4}
  .deck .count{color:#8fa4aa;font-size:10px;margin-top:8px}
  .mini{height:4px;background:#18323b;border-radius:3px;margin-top:8px;overflow:hidden}
  .mini i{display:block;height:100%;background:var(--green)}
  .deck .known{color:#68808a;font-size:10px;margin-top:4px}

  /* deck view */
  .back{border:0;background:none;color:var(--cyan);font-size:12px;font-weight:800;cursor:pointer;padding:0}
  h2.deck-title{font-size:17px;margin:10px 0 0}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:12px}
  .tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);
    padding:9px 12px;font-size:12px;cursor:pointer}
  .tab.active{border-color:var(--cyan);color:var(--cyan);font-weight:700}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;text-align:center}
  .statgrid div{border:1px solid var(--line);border-radius:5px;padding:9px 4px}
  .statgrid b{display:block;font-size:16px}
  .statgrid small{color:#687f87;font-size:9px}

  .filters,.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{border:1px solid var(--line);border-radius:999px;background:var(--panel);
    color:var(--muted);padding:5px 12px;font-size:11px;cursor:pointer}
  .chip.active{border-color:var(--cyan);color:var(--cyan);background:#2999a51a}
  .tools .chip.on{border-color:var(--orange);color:#ff9c76}

  .rate{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}
  .rate select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:4px 6px}

  .progress{color:var(--muted);font-size:11px;margin:14px 0 4px}
  .pbar{height:4px;background:#18323b;border-radius:3px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--cyan);transition:width .25s}

  .card{border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:12px;
    background:linear-gradient(145deg,#0f222b,#08171e);cursor:pointer;user-select:none;
    min-height:230px;touch-action:pan-y;transition:transform .12s}
  .card .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .card .term{font-size:26px;font-weight:700;margin:0}
  .card .ipa{color:var(--muted);margin:4px 0 0}
  .card .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .sound{border:1px solid #2c6870;background:#2eb4c013;color:#55dbe7;border-radius:999px;
    padding:4px 10px;font-size:13px;cursor:pointer}
  .tag{background:#0d252e;border:1px solid #294852;border-radius:999px;color:#6faeb5;
    padding:2px 8px;font-size:10px}
  .diff{color:#5c757d;font-size:10px}
  .card .hint{color:#5c757d;font-size:11px;margin:22px 0 0}
  .card .back-body{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .card .mean b{font-style:italic;color:var(--muted);font-weight:400;font-size:12px}
  .card .mean .def{color:#dfeef0}
  .card .mean .tr{color:var(--muted);font-size:13px}
  .ex{background:#05111773;border:1px solid var(--line);border-radius:5px;padding:9px}
  .ex .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .ex .en{color:#c4d5d8;font-size:13px}
  .ex .tr{color:var(--muted);font-size:12px;margin-top:3px}

  .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .grade button{border:0;border-radius:5px;padding:11px;font-size:13px;font-weight:700;
    color:white;cursor:pointer}
  .g-no{background:var(--red)}.g-yes{background:var(--green)}

  .link{border:0;background:none;color:var(--cyan);font-size:11px;cursor:pointer;
    margin-top:12px;padding:0;text-decoration:underline}
  .unknown-list{margin:8px 0 0;padding:10px 10px 10px 28px;border:1px solid var(--line);
    border-radius:5px;font-size:12px;color:#c4d5d8;line-height:1.7}

  .empty{border:1px solid var(--line);border-radius:8px;padding:26px;text-align:center;
    color:var(--muted);margin-top:18px}

  /* overview */
  .ovhead{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .ovhead input{flex:1;min-width:160px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px}
  .ovhead select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:7px}
  .ovcount{color:var(--muted);font-size:11px;margin:8px 0}
  .ovlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .ovrow{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px;
    border-top:1px solid var(--line)}
  .ovrow:first-child{border-top:0}
  .ovrow .word{flex:1;text-align:left;background:none;border:0;color:var(--text);cursor:pointer}
  .ovrow .word .t{font-weight:700}
  .ovrow .word .i{color:var(--muted);font-size:11px;margin-left:6px}
  .ovrow .word .m{color:var(--muted);margin-left:6px}
  .badge{font-size:10px;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .b-known{background:#25875933;color:#8fe9bb}
  .b-unknown{background:#a83a2733;color:#ffb0a5}
  .b-new{background:#1b333c;color:#8199a0}

  /* celebration */
  .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
    background:#01070bdc;backdrop-filter:blur(8px)}
  .cbox{max-width:360px;text-align:center;border:1px solid #4bd6e43d;border-radius:10px;
    background:#091a22;padding:26px}
  .cbox .cup{font-size:46px}
  .cbox h3{margin:8px 0 4px}
  .cbox p{color:var(--muted);font-size:13px}
  .cbox button{margin-top:14px;border:0;border-radius:5px;padding:9px 16px;font-weight:700;
    background:var(--cyan);color:#04141a;cursor:pointer}

  @media(max-width:620px){
    .decks{grid-template-columns:1fr}
    .grade{grid-template-columns:1fr 1fr}
    main{width:calc(100% - 24px)}
  }
</style>
</head>

<header>
  <h1>TOEIC Flashcards</h1>
  <div style="display:flex;align-items:center;gap:14px">
    <span class="streak" id="streak"></span>
    <a href="index.html" style="color:var(--cyan);font-size:12px;text-decoration:none">Đấu trường →</a>
  </div>
</header>
<main id="app"></main>

<script>
/* Word bank inlined at build time (tools/build-flashcards-html.mjs). */
const WORD_BANK = [{"id":"affect","term":"affect","ipa":"/əˈfɛkt/","meanings":[{"pos":"v.","definition":"to influence or produce a change in something"}],"examples":[{"sentence":"The delayed shipment will affect our ability to meet the client deadline."},{"sentence":"Rising fuel costs have affected profit margins across the logistics division."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"effect","term":"effect","ipa":"/ɪˈfɛkt/","meanings":[{"pos":"n.","definition":"a change that results from an action; a result"},{"pos":"v.","definition":"to bring about or cause (a change), typically formal/legal usage"}],"examples":[{"sentence":"The new procurement policy will take effect on the first of next month."},{"sentence":"Management effected several changes to the reimbursement process."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"assure","term":"assure","ipa":"/əˈʃʊr/","meanings":[{"pos":"v.","definition":"to tell someone confidently that something is true, to remove doubt"}],"examples":[{"sentence":"The account manager assured the client that the invoice error would be corrected."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"ensure","term":"ensure","ipa":"/ɪnˈʃʊr/","meanings":[{"pos":"v.","definition":"to make certain that something will happen or is the case"}],"examples":[{"sentence":"Please ensure that all expense reports are submitted before the fiscal quarter closes."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"insure","term":"insure","ipa":"/ɪnˈʃʊr/","meanings":[{"pos":"v.","definition":"to arrange for compensation in the event of damage, loss, or death, in exchange for premiums"}],"examples":[{"sentence":"The warehouse contents are insured against fire and water damage."}],"context":"General Business","skill":"vocab","difficulty":4},{"id":"comprise","term":"comprise","ipa":"/kəmˈpraɪz/","meanings":[{"pos":"v.","definition":"to consist of; to be made up of (whole comprises parts)"}],"examples":[{"sentence":"The board comprises seven members, including two external directors."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"compose","term":"compose","ipa":"/kəmˈpoʊz/","meanings":[{"pos":"v.","definition":"to make up or form (parts compose the whole); to write or create"}],"examples":[{"sentence":"The committee is composed of representatives from each regional office."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"discrete","term":"discrete","ipa":"/dɪˈskriːt/","meanings":[{"pos":"adj.","definition":"individually separate and distinct"}],"examples":[{"sentence":"The rollout was divided into three discrete phases, each with its own budget."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"discreet","term":"discreet","ipa":"/dɪˈskriːt/","meanings":[{"pos":"adj.","definition":"careful and prudent in speech or action, especially to avoid embarrassment"}],"examples":[{"sentence":"Employees are asked to be discreet about the pending merger until the official announcement."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"eligible","term":"eligible","ipa":"/ˈɛlɪdʒəbəl/","meanings":[{"pos":"adj.","definition":"having the right to do or receive something; qualified"}],"examples":[{"sentence":"Employees who have completed one year of service are eligible for the pension plan."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"legible","term":"legible","ipa":"/ˈlɛdʒəbəl/","meanings":[{"pos":"adj.","definition":"clear enough to be read easily"}],"examples":[{"sentence":"The scanned contract must remain legible before it can be filed with the registry."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"adapt","term":"adapt","ipa":"/əˈdæpt/","meanings":[{"pos":"v.","definition":"to adjust to new conditions"}],"examples":[{"sentence":"The marketing team adapted its strategy to suit the regional market."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"adopt","term":"adopt","ipa":"/əˈdɒpt/","meanings":[{"pos":"v.","definition":"to choose to take up or follow (a method, policy, or plan)"}],"examples":[{"sentence":"The company plans to adopt a new inventory management system next quarter."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"adept","term":"adept","ipa":"/əˈdɛpt/","meanings":[{"pos":"adj.","definition":"very skilled or proficient at something"}],"examples":[{"sentence":"She is remarkably adept at negotiating favorable terms with overseas suppliers."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"considerable","term":"considerable","ipa":"/kənˈsɪdərəbəl/","meanings":[{"pos":"adj.","definition":"notably large in amount, extent, or degree"}],"examples":[{"sentence":"The renovation required a considerable investment from the property owners."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"considerate","term":"considerate","ipa":"/kənˈsɪdərɪt/","meanings":[{"pos":"adj.","definition":"careful not to cause inconvenience or hurt to others; thoughtful"}],"examples":[{"sentence":"It was considerate of the manager to reschedule the meeting around the holiday."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"economic","term":"economic","ipa":"/ˌɛkəˈnɒmɪk/","meanings":[{"pos":"adj.","definition":"relating to economics or the economy"}],"examples":[{"sentence":"Analysts cited economic uncertainty as the reason for the delayed expansion."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"economical","term":"economical","ipa":"/ˌɛkəˈnɒmɪkəl/","meanings":[{"pos":"adj.","definition":"giving good value or return for the resources spent; thrifty"}],"examples":[{"sentence":"Switching to digital invoicing proved far more economical than printing paper copies."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"sensible","term":"sensible","ipa":"/ˈsɛnsəbəl/","meanings":[{"pos":"adj.","definition":"showing good judgment; practical"}],"examples":[{"sentence":"It would be sensible to back up the database before installing the update."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"sensitive","term":"sensitive","ipa":"/ˈsɛnsɪtɪv/","meanings":[{"pos":"adj.","definition":"easily affected, hurt, or offended; requiring careful handling"}],"examples":[{"sentence":"The salary negotiations are a sensitive matter and should not be discussed openly."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"meet-a-deadline","term":"meet a deadline","ipa":"/miːt ə ˈdɛdlaɪn/","meanings":[{"pos":"phrase","definition":"to finish something by the required time"}],"examples":[{"sentence":"The design team worked overtime to meet the deadline for the product launch."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"raise-a-concern","term":"raise a concern","ipa":"/reɪz ə kənˈsɜrn/","meanings":[{"pos":"phrase","definition":"to formally mention a worry or issue"}],"examples":[{"sentence":"Several shareholders raised concerns about the proposed budget cuts during the meeting."}],"context":"Listening Part 3","skill":"collocation","difficulty":3},{"id":"address-an-issue","term":"address an issue","ipa":"/əˈdrɛs ən ˈɪʃuː/","meanings":[{"pos":"phrase","definition":"to deal with or discuss a problem directly"}],"examples":[{"sentence":"The customer service team is working to address the issue raised in your last email."}],"context":"Part 6","skill":"collocation","difficulty":3},{"id":"file-a-complaint","term":"file a complaint","ipa":"/faɪl ə kəmˈpleɪnt/","meanings":[{"pos":"phrase","definition":"to formally submit a complaint"}],"examples":[{"sentence":"A customer filed a complaint after receiving a damaged shipment for the second time."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"convene-a-meeting","term":"convene a meeting","ipa":"/kənˈviːn ə ˈmiːtɪŋ/","meanings":[{"pos":"phrase","definition":"to call people together for a formal meeting"}],"examples":[{"sentence":"The CEO convened an emergency meeting to discuss the supply chain disruption."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"place-an-order","term":"place an order","ipa":"/pleɪs ən ˈɔrdər/","meanings":[{"pos":"phrase","definition":"to formally request goods from a supplier"}],"examples":[{"sentence":"We would like to place an order for 500 units of the new packaging material."}],"context":"Part 7","skill":"collocation","difficulty":2},{"id":"extend-an-invitation","term":"extend an invitation","ipa":"/ɪkˈstɛnd ən ˌɪnvɪˈteɪʃən/","meanings":[{"pos":"phrase","definition":"to formally invite someone"}],"examples":[{"sentence":"The board extended an invitation to the keynote speaker to join the advisory panel."}],"context":"Part 6","skill":"collocation","difficulty":4},{"id":"draw-a-conclusion","term":"draw a conclusion","ipa":"/drɔ ə kənˈkluʒən/","meanings":[{"pos":"phrase","definition":"to decide something is true after considering the facts"}],"examples":[{"sentence":"It is too early to draw any conclusions from the pilot survey results."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"incur-a-cost","term":"incur a cost","ipa":"/ɪnˈkɜr ə kɔst/","meanings":[{"pos":"phrase","definition":"to become liable for an expense as a result of an action"}],"examples":[{"sentence":"Canceling the contract early will incur a substantial penalty cost."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"reach-a-consensus","term":"reach a consensus","ipa":"/riːtʃ ə kənˈsɛnsəs/","meanings":[{"pos":"phrase","definition":"to arrive at general agreement among a group"}],"examples":[{"sentence":"After two hours of debate, the committee finally reached a consensus on the venue."}],"context":"Listening Part 3","skill":"collocation","difficulty":4},{"id":"submit-an-application","term":"submit an application","ipa":"/səbˈmɪt ən ˌæplɪˈkeɪʃən/","meanings":[{"pos":"phrase","definition":"to formally send in a request or form"}],"examples":[{"sentence":"Candidates must submit their applications no later than Friday at 5 p.m."}],"context":"Part 7","skill":"collocation","difficulty":2},{"id":"waive-a-fee","term":"waive a fee","ipa":"/weɪv ə fiː/","meanings":[{"pos":"phrase","definition":"to voluntarily give up the right to charge a fee"}],"examples":[{"sentence":"As a goodwill gesture, the bank agreed to waive the late payment fee."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"defer-payment","term":"defer payment","ipa":"/dɪˈfɜr ˈpeɪmənt/","meanings":[{"pos":"phrase","definition":"to postpone payment to a later date"}],"examples":[{"sentence":"The supplier allowed the client to defer payment until the shipment arrived."}],"context":"General Business","skill":"collocation","difficulty":4},{"id":"honor-a-contract","term":"honor a contract","ipa":"/ˈɒnər ə ˈkɒntrækt/","meanings":[{"pos":"phrase","definition":"to fulfill the terms of an agreement"}],"examples":[{"sentence":"The contractor failed to honor the terms of the original agreement."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"streamline-operations","term":"streamline operations","ipa":"/ˈstriːmlaɪn ˌɒpəˈreɪʃənz/","meanings":[{"pos":"phrase","definition":"to make a process more efficient by simplifying it"}],"examples":[{"sentence":"The new software was introduced to streamline operations across all branches."}],"context":"Part 6","skill":"collocation","difficulty":3},{"id":"forgo","term":"forgo","ipa":"/fɔrˈɡoʊ/","meanings":[{"pos":"v.","definition":"to decide not to have or do something; to give up"}],"examples":[{"sentence":"Staff were asked to forgo the annual bonus this year due to budget constraints."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"preclude","term":"preclude","ipa":"/prɪˈkluːd/","meanings":[{"pos":"v.","definition":"to prevent something from happening; to make impossible"}],"examples":[{"sentence":"A prior commitment precludes him from attending the trade show this year."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"preempt","term":"preempt"," cing"}],"examples":[{"sentence":"The sales team presented a compelling case for expanding into the Asian market."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"founded","term":"founded","ipa":"/ˈfaʊndɪd/","meanings":[{"pos":"v. (past participle of found)","definition":"established or set up (an organization)"},{"pos":"adj.","definition":"based on good reasons; justified (usually \"well-founded\")"}],"examples":[{"sentence":"The firm, founded in 1998, now operates in twelve countries."},{"sentence":"The auditor’s concerns about the accounts proved to be well-founded."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"staffed","term":"staffed","ipa":"/stæft/","meanings":[{"pos":"adj. (past participle used as modifier)","definition":"provided with personnel; describing how a place is supplied with workers"}],"examples":[{"sentence":"The help desk is fully staffed between 9 a.m. and 6 p.m. on weekdays."},{"sentence":"A newly staffed regional office will open in Busan next spring."}],"context":"Part 5","skill":"grammar","difficulty":3},{"id":"qualified","term":"qualified","ipa":"/ˈkwɒlɪˌfaɪd/","meanings":[{"pos":"adj.","definition":"having the necessary skills or knowledge to do something"},{"pos":"adj.","definition":"limited or restricted in some way, as in \"qualified approval\""}],"examples":[{"sentence":"Only qualified applicants with a CPA license will be considered for the position."},{"sentence":"The board gave only qualified support to the merger proposal."}],"context":"Part 5","skill":"grammar","difficulty":4},{"id":"attached","term":"attached","ipa":"/əˈtætʃt/","meanings":[{"pos":"adj. (participle)","definition":"fastened or connected to something, often referring to a document"}],"examples":[{"sentence":"Please review the attached invoice and confirm receipt by Friday."}],"context":"Part 6","skill":"grammar","difficulty":2},{"id":"enclosed","term":"enclosed","ipa":"/ɪnˈkloʊzd/","meanings":[{"pos":"adj. (participle)","definition":"incl ucted an exhaustive review of the company’s financial records."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"exhausted","term":"exhausted","ipa":"/ɪɡˈzɔstɪd/","meanings":[{"pos":"adj.","definition":"extremely tired; also, used up completely (e.g. funds, resources)"}],"examples":[{"sentence":"The relief fund was exhausted within weeks of the disaster."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"lucrative","term":"lucrative","ipa":"/ˈluːkrətɪv/","meanings":[{"pos":"adj.","definition":"producing a great deal of profit"}],"examples":[{"sentence":"The firm secured a lucrative contract with a major telecommunications provider."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"prudent","term":"prudent","ipa":"/ˈpruːdənt/","meanings":[{"pos":"adj.","definition":"acting with or showing care and thought for the future; sensible"}],"examples":[{"sentence":"It would be prudent to diversify the company’s supplier base."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"contingent","term":"contingent","ipa":"/kənˈtɪndʒənt/","meanings":[{"pos":"adj.","definition":"dependent on certain circumstances; conditional"}],"examples":[{"sentence":"The final payment is contingent on the client’s approval of the deliverables."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"stipulate","term":"stipulate","ipa":"/ˈstɪpjəˌleɪt/","meanings":[{"pos":"v.","definition":"to specify as a condition or requirement in an agreement"}],"examples":[{"sentence":"The contract stipulates that all deliveries must arrive within 48 hours of the order."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"waive","term":"waive","ipa":"/weɪv/","meanings":[{"pos":"v.","definition":"to voluntarily give up a right or claim"}],"examples":[{"sentence":"The landlord agreed to waive the security deposit for long-term tenants."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"waver","term":"waver","ipa":"/ˈweɪvər/","meanings":[{"pos":"v.","d ntext":"Part 7","skill":"vocab","difficulty":4},{"id":"commend","term":"commend","ipa":"/kəˈmɛnd/","meanings":[{"pos":"v.","definition":"to praise formally"}],"examples":[{"sentence":"The regional director commended the team for exceeding its sales target."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"commend-vs-recommend","term":"commend vs recommend","ipa":"/kəˈmɛnd vs ˌrɛkəˈmɛnd/","meanings":[{"pos":"note","definition":"commend = to praise; recommend = to suggest as suitable — often confused due to shared root"}],"examples":[{"sentence":"The panel commended her work and recommended her for the senior analyst role."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"appoint","term":"appoint","ipa":"/əˈpɔɪnt/","meanings":[{"pos":"v.","definition":"to assign someone to a job or role officially"}],"examples":[{"sentence":"The board appointed a new chief financial officer effective in June."}],"context":"Part 5","skill":"vocab","difficulty":2},{"id":"appointment","term":"appointment","ipa":"/əˈpɔɪntmənt/","meanings":[{"pos":"n.","definition":"a scheduled meeting"},{"pos":"n.","definition":"the act of assigning someone to a position"}],"examples":[{"sentence":"Her appointment as regional manager was announced at the annual conference."}],"context":"Part 5","skill":"grammar","difficulty":3},{"id":"appointed","term":"appointed","ipa":"/əˈpɔɪntɪd/","meanings":[{"pos":"adj. (participle)","definition":"having been assigned to a position or role; also, agreed upon (as in \"the appointed time\")"}],"examples":[{"sentence":"The newly appointed director will oversee both regional offices."}],"context":"Part 5","skill":"grammar","difficulty":3},{"id":"designated","term":"designated","ipa":"/ˈdɛzɪɡˌneɪtɪd/","meanings":[{"pos":"adj. (participle)","definition":"officially chosen for a specific purpose"}],"examples":[{"sentence":"Visitors must park in the designated area near the loading dock."}],"context":"Part 5","skill":"grammar","difficulty":3},{"id":"nominate","term":"nominate","ipa":"/ˈnɒmɪˌneɪt/","meanings":[{"pos":"v.","definition":"to formally propose someone for a role or award"}],"examples":[{"sentence":"She was nominated for the employee-of-the-year award by her supervisor."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"inaugurate","term":"inaugurate","ipa":"/ɪˈnɔɡjəˌreɪt/","meanings":[{"pos":"v.","definition":"to begin or introduce a new system, policy, or period formally"}],"examples":[{"sentence":"The mayor will inaugurate the new transit line next Thursday."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"commence","term":"commence","ipa":"/kəˈmɛns/","meanings":[{"pos":"v.","definition":"to begin, especially formally"}],"examples":[{"sentence":"Construction on the new terminal will commence in early spring."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"culminate-in","term":"culminate in","ipa":"/ˈkʌlmɪˌneɪt ɪn/","meanings":[{"pos":"phrase","definition":"to reach a climax or final result"}],"examples":[{"sentence":"Months of negotiation culminated in a landmark trade agreement."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"conclude","term":"conclude","ipa":"/kənˈkluːd/","meanings":[{"pos":"v.","definition":"to bring to an end; to decide after consideration"}],"examples":[{"sentence":"The auditors concluded that no further action was necessary."}],"context":"Part 5","skill":"vocab","difficulty":2},{"id":"draft","term":"draft","ipa":"/dræft/","meanings":[{"pos":"n./v.","definition":"a preliminary version of a document; to prepare such a version"}],"examples":[{"sentence":"The legal team will draft a revised version of the vendor agreement."}],"context":"Part 5","skill":"vocab","difficulty":2},{"id":"finalize","term":"finalize","ipa":"/ˈfaɪnəˌlaɪz/","meanings":[{"pos":"v.","definition":"to complete or confirm the last details of something"}],"examples":[{"sentence":"The two companies expect to finalize the deal by the end of the month."}],"context":"Part 5","skill":"vocab","difficulty":2},{"id":"revise","term":"revise","ipa":"/rɪˈvaɪz/","meanings":[{"pos":"v.","definition":"to reconsider and alter in light of new evidence"}],"examples":[{"sentence":"The forecast was revised downward following the disappointing quarterly results."}],"context":"Part 5","skill":"vocab","difficulty":2},{"id":"revamp","term":"revamp","ipa":"/riˈvæmp/","meanings":[{"pos":"v.","definition":"to give something a new, improved form or structure"}],"examples":[{"sentence":"The retailer plans to revamp its loyalty program to attract younger customers."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"overhaul","term":"overhaul","ipa":"/ˈoʊvərˌhɔl/","meanings":[{"pos":"n./v.","definition":"a thorough examination and improvement of a system; to carry out such an improvement"}],"examples":[{"sentence":"The IT department completed a full overhaul of the company’s network security."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"discrepancy","term":"discrepancy","ipa":"/dɪˈskrɛpənsi/","meanings":[{"pos":"n.","definition":"a difference between things that should be the same"}],"examples":[{"sentence":"The accountant noticed a discrepancy between the invoice and the purchase order."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"discretion","term":"discretion","ipa":"/dɪˈskrɛʃən/","meanings":[{"pos":"n.","definition":"the freedom to decide something based on one’s own judgment"}],"examples":[{"sentence":"Managers may approve minor expenses at their own discretion."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"ambivalent","term":"ambivalent","ipa":"/æmˈbɪvələnt/","meanings":[{"pos":"adj.","definition":"having mixed or contradictory feelings about something"}],"examples":[{"sentence":"The board remained ambivalent about entering the volatile overseas market."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"reluctant","term":"reluctant","ipa":"/rɪˈlʌktənt/","meanings":[{"pos":"adj.","definition":"unwilling and hesitant to do something"}],"examples":[{"sentence":"Investors were reluctant to commit funds during the period of uncertainty."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"apprehensive","term":"apprehensive","ipa":"/ˌæprɪˈhɛnsɪv/","meanings":[{"pos":"adj.","definition":"anxious or fearful about a future event"}],"examples":[{"sentence":"Staff were apprehensive about the upcoming restructuring announcement."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"skeptical","term":"skeptical","ipa":"/ˈskɛptɪkəl/","meanings":[{"pos":"adj.","definition":"having doubts about the truth or value of something"}],"examples":[{"sentence":"Some analysts remain skeptical about the accuracy of the growth forecast."}],"context":"Part 7","skill":"vocab","difficulty":3},{"id":"wary","term":"wary","ipa":"/ˈwɛri/","meanings":[{"pos":"adj.","definition":"cautious about possible dangers or problems"}],"examples":[{"sentence":"Suppliers are wary of extending credit to new clients without a track record."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"diligent","term":"diligent","ipa":"/ˈdɪlɪdʒənt/","meanings":[{"pos":"adj.","definition":"showing careful and persistent effort in one’s work"}],"examples":[{"sentence":"The compliance officer was diligent in reviewing every clause of the contract."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"due-diligence","term":"due diligence","ipa":"/duː ˈdɪlɪdʒəns/","meanings":[{"pos":"phrase","definition":"a thorough investigation undertaken before entering an agreement"}],"examples":[{"sentence":"The investment firm conducted due diligence before acquiring the startup."}],"context":"General Business","skill":"collocation","difficulty":5},{"id":"conduct-an-audit","term":"conduct an audit","ipa":"/kənˈdʌkt ən ˈɔdɪt/","meanings":[{"pos":"phrase","definition":"to carry out a formal examination of records or accounts"}],"examples":[{"sentence":"An external firm was hired to conduct an audit of the annual accounts."}],"context":"General Business","skill":"collocation","difficulty":3},{"id":"garner-support","term":"garner support","ipa":"/ˈɡɑrnər səˈpɔrt/","meanings":[{"pos":"phrase","definition":"to gather or obtain backing from others"}],"examples":[{"sentence":"The proposal garnered strong support from the finance and operations teams."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"field-questions","term":"field questions","ipa":"/fiːld ˈkwɛstʃənz/","meanings":[{"pos":"phrase","definition":"to respond to questions from an audience, often unplanned"}],"examples":[{"sentence":"After the presentation, the CFO fielded questions from shareholders."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"table-a-proposal","term":"table a proposal","ipa":"/ˈteɪbəl ə prəˈpoʊzəl/","meanings":[{"pos":"phrase","definition":"to postpone discussion of a proposal, or (British usage) to formally present it"}],"examples":[{"sentence":"The committee decided to table the proposal until the next quarterly meeting."}],"context":"Listening Part 3","skill":"collocation","difficulty":5},{"id":"sign-off-on","term":"sign off on","ipa":"/saɪn ɔf ɒn/","meanings":[{"pos":"phrase","definition":"to give formal approval for something"}],"examples":[{"sentence":"The director still needs to sign off on the revised marketing budget."}],"context":"Listening Part 3","skill":"collocation","difficulty":3},{"id":"green-light","term":"green-light","ipa":"/ˈɡriːn laɪt/","meanings":[{"pos":"v.","definition":"to give official approval to proceed with a project"}],"examples":[{"sentence":"The executive committee green-lighted the expansion into new markets."}],"context":"Listening Part 3","skill":"vocab","difficulty":3},{"id":"put-on-hold","term":"put on hold","ipa":"/pʊt ɒn hoʊld/","meanings":[{"pos":"phrase","definition":"to temporarily suspend or delay an action"}],"examples":[{"sentence":"The renovation project has been put on hold pending budget approval."}],"context":"Listening Part 3","skill":"collocation","difficulty":2},{"id":"scale-back","term":"scale back","ipa":"/skeɪl bæk/","meanings":[{"pos":"phrase","definition":"to reduce the size or extent of something"}],"examples":[{"sentence":"The firm decided to scale back production due to weakening demand."}],"context":"Listening Part 4","skill":"collocation","difficulty":3},{"id":"ramp-up","term":"ramp up","ipa":"/ræmp ʌp/","meanings":[{"pos":"phrase","definition":"to increase the level or intensity of an activity"}],"examples":[{"sentence":"The factory is ramping up production ahead of the holiday season."}],"context":"Listening Part 4","skill":"collocation","difficulty":3},{"id":"in-the-pipeline","term":"in the pipeline","ipa":"/ɪn ðə ˈpaɪpˌlaɪn/","meanings":[{"pos":"phrase","definition":"currently being developed or planned"}],"examples":[{"sentence":"Several new product lines are currently in the pipeline for next year."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"on-par-with","term":"on par with","ipa":"/ɒn pɑr wɪð/","meanings":[{"pos":"phrase","definition":"at the same level or standard as"}],"examples":[{"sentence":"This quarter’s output is on par with last year’s record performance."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"across-the-board","term":"across the board","ipa":"/əˈkrɔs ðə bɔrd/","meanings":[{"pos":"phrase","definition":"applying to all parts or members of a group equally"}],"examples":[{"sentence":"Salary increases were applied across the board this year, regardless of department."}],"context":"Listening Part 4","skill":"collocation","difficulty":4},{"id":"letter-of-intent","term":"letter of intent","ipa":"/ˈlɛtər ʌv ɪnˈtɛnt/","meanings":[{"pos":"phrase","definition":"a document outlining a preliminary agreement before a formal contract"}],"examples":[{"sentence":"Both companies signed a letter of intent ahead of the formal merger agreement."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"nondisclosure-agreement","term":"nondisclosure agreement","ipa":"/ˌnɒndɪsˈkloʊʒər əˈɡriːmənt/","meanings":[{"pos":"phrase","definition":"a legal contract preventing parties from sharing confidential information"}],"examples":[{"sentence":"Contractors are required to sign a nondisclosure agreement before viewing the blueprints."}],"context":"Part 7","skill":"collocation","difficulty":3},{"id":"force-majeure","term":"force majeure","ipa":"/fɔrs mɑˈʒɜr/","meanings":[{"pos":"n.","definition":"a contract clause freeing parties from liability for extraordinary events beyond their control"}],"examples":[{"sentence":"The supplier invoked the force majeure clause after the factory was damaged in the storm."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"indemnify","term":"indemnify","ipa":"/ɪnˈdɛmnɪˌfaɪ/","meanings":[{"pos":"v.","definition":"to compensate for harm or loss; to protect against legal liability"}],"examples":[{"sentence":"The vendor agreed to indemnify the client against any third-party claims."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"aforementioned","term":"aforementioned","ipa":"/əˈfɔrˌmɛnʃənd/","meanings":[{"pos":"adj.","definition":"mentioned previously in the same document"}],"examples":[{"sentence":"The aforementioned terms apply to all subsidiaries of the company."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"hereinafter","term":"hereinafter","ipa":"/ˌhɪrɪnˈæftər/","meanings":[{"pos":"adv.","definition":"from this point onward in a document (legal/contract usage)"}],"examples":[{"sentence":"Global Freight Co., hereinafter referred to as \"the Carrier,\" agrees to the following terms."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"ceiling","term":"ceiling","ipa":"/ˈsiːlɪŋ/","meanings":[{"pos":"n.","definition":"an upper limit on an amount, such as spending or price"}],"examples":[{"sentence":"The department must operate within the spending ceiling set by finance."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"threshold","term":"threshold","ipa":"/ˈθrɛʃhoʊld/","meanings":[{"pos":"n.","definition":"the level or point at which something begins to happen or apply"}],"examples":[{"sentence":"Orders over the $500 threshold qualify for free shipping."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"benchmark","term":"benchmark","ipa":"/ˈbɛntʃˌmɑrk/","meanings":[{"pos":"n./v.","definition":"a standard used for comparison; to compare against such a standard"}],"examples":[{"sentence":"The team benchmarked its delivery times against industry leaders."}],"context":"Part 7","skill":"vocab","difficulty":4},{"id":"gauge","term":"gauge","ipa":"/ɡeɪdʒ/","meanings":[{"pos":"v./n.","definition":"to estimate or judge; an instrument for measuring"}],"examples":[{"sentence":"The survey was designed to gauge customer satisfaction with the new app."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"discrepant-vs-disparate","term":"discrepant vs disparate","ipa":"/dɪˈskrɛpənt vs ˈdɪspərɪt/","meanings":[{"pos":"note","definition":"discrepant = differing/inconsistent (of figures); disparate = fundamentally different in kind"}],"examples":[{"sentence":"The two reports contained discrepant figures drawn from disparate data sources."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"disparate","term":"disparate","ipa":"/ˈdɪspərɪt/","meanings":[{"pos":"adj.","definition":"essentially different in kind; not comparable"}],"examples":[{"sentence":"The merger brought together two disparate corporate cultures."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"pragmatic","term":"pragmatic","ipa":"/præɡˈmætɪk/","meanings":[{"pos":"adj.","definition":"dealing with things sensibly and practically"}],"examples":[{"sentence":"The manager took a pragmatic approach to resolving the staffing shortage."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"pertinent","term":"pertinent","ipa":"/ˈpɜrtɪnənt/","meanings":[{"pos":"adj.","definition":"relevant or applicable to a particular matter"}],"examples":[{"sentence":"Please attach all pertinent documents to your reimbursement request."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"redress","term":"redress","ipa":"/rɪˈdrɛs/","meanings":[{"pos":"v./n.","definition":"to remedy or set right; a remedy for a wrong or grievance"}],"examples":[{"sentence":"Customers may seek redress through the company’s formal complaints procedure."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"recourse","term":"recourse","ipa":"/ˈriːkɔrs/","meanings":[{"pos":"n.","definition":"a source of help in a difficult situation; the right to demand compensation"}],"examples":[{"sentence":"Without a written contract, the freelancer had little legal recourse."}],"context":"Part 7","skill":"vocab","difficulty":5},{"id":"vested-interest","term":"vested interest","ipa":"/ˈvɛstɪd ˈɪntrɪst/","meanings":[{"pos":"phrase","definition":"a personal stake in something, often influencing objectivity"}],"examples":[{"sentence":"Board members with a vested interest in the deal recused themselves from the vote."}],"context":"Part 7","skill":"collocation","difficulty":5},{"id":"conflict-of-interest","term":"conflict of interest","ipa":"/ˈkɒnflɪkt ʌv ˈɪntrɪst/","meanings":[{"pos":"phrase","definition":"a situation where personal interests could improperly influence professional judgment"}],"examples":[{"sentence":"The consultant disclosed a potential conflict of interest before joining the review panel."}],"context":"Part 7","skill":"collocation","difficulty":4},{"id":"due-course","term":"due course","ipa":"/duː kɔrs/","meanings":[{"pos":"phrase","definition":"at the appropriate or natural time, without being rushed"}],"examples":[{"sentence":"Applicants will be notified of the results in due course."}],"context":"Part 6","skill":"collocation","difficulty":4},{"id":"comply","term":"comply","ipa":"/kəmˈplaɪ/","meanings":[{"pos":"v.","definition":"to act in accordance with a rule, order, or request","translation":"tuân thủ, làm theo"}],"examples":[{"sentence":"All contractors must comply with the site safety regulations.","translation":"Mọi nhà thầu phải tuân thủ quy định an toàn công trường."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"compliance","term":"compliance","ipa":"/kəmˈplaɪəns/","meanings":[{"pos":"n.","definition":"the act of obeying a rule or meeting a standard","translation":"sự tuân thủ"}],"examples":[{"sentence":"The audit confirmed the plant’s compliance with environmental standards.","translation":"Cuộc kiểm toán xác nhận nhà máy tuân thủ tiêu chuẩn môi trường."}],"context":"Part 5","skill":"grammar","difficulty":4},{"id":"compliant","term":"compliant","ipa":"/kəmˈplaɪənt/","meanings":[{"pos":"adj.","definition":"meeting the required rules or standards","translation":"đúng chuẩn, tuân thủ"}],"examples":[{"sentence":"The new packaging is fully compliant with export requirements.","translation":"Bao bì mới hoàn toàn đúng chuẩn yêu cầu xuất khẩu."}],"context":"Part 5","skill":"grammar","difficulty":4},{"id":"attributable","term":"attributable","ipa":"/əˈtrɪbjətəbl/","meanings":[{"pos":"adj.","definition":"able to be regarded as caused by something","translation":"có thể quy cho, do bởi"}],"examples":[{"sentence":"The revenue growth is largely attributable to the new product line.","translation":"Mức tăng doanh thu phần lớn là nhờ dòng sản phẩm mới."}],"context":"Part 5","skill":"collocation","difficulty":5},{"id":"conducive","term":"conducive","ipa":"/kənˈduːsɪv/","meanings":[{"pos":"adj.","definition":"making a certain situation or outcome likely or possible","translation":"thuận lợi cho, tạo điều kiện"}],"examples":[{"sentence":"An open floor plan is more conducive to collaboration.","translation":"Bố trí văn phòng mở thuận lợi hơn cho việc hợp tác."}],"context":"Part 5","skill":"collocation","difficulty":5},{"id":"prospective","term":"prospective","ipa":"/prəˈspɛktɪv/","meanings":[{"pos":"adj.","definition":"likely to happen or become; potential","translation":"tiềm năng, tương lai"}],"examples":[{"sentence":"The brochure is sent to all prospective clients.","translation":"Tờ rơi được gửi đến mọi khách hàng tiềm năng."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"respective","term":"respective","ipa":"/rɪˈspɛktɪv/","meanings":[{"pos":"adj.","definition":"belonging separately to each of the people mentioned","translation":"tương ứng, riêng của mỗi bên"}],"examples":[{"sentence":"The managers returned to their respective departments after the briefing.","translation":"Các quản lý trở về phòng ban của mình sau buổi họp nhanh."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"stringent","term":"stringent","ipa":"/ˈstrɪndʒənt/","meanings":[{"pos":"adj.","definition":"strict, precise, and demanding","translation":"nghiêm ngặt"}],"examples":[{"sentence":"Pharmaceutical labels must meet stringent labeling rules.","translation":"Nhãn dược phẩm phải đáp ứng quy định ghi nhãn nghiêm ngặt."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"adverse","term":"adverse","ipa":"/ˈædvɜːrs/","meanings":[{"pos":"adj.","definition":"unfavourable; harmful","translation":"bất lợi, tiêu cực"}],"examples":[{"sentence":"The recall had an adverse effect on the brand’s reputation.","translation":"Đợt thu hồi gây tác động bất lợi đến uy tín thương hiệu."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"averse","term":"averse","ipa":"/əˈvɜːrs/","meanings":[{"pos":"adj.","definition":"having a strong dislike of or opposition to something","translation":"ngại, không ưa (thường + to)"}],"examples":[{"sentence":"The board is averse to taking on additional debt this year.","translation":"Hội đồng quản trị ngại gánh thêm nợ trong năm nay."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"comprehensive","term":"comprehensive","ipa":"/ˌkɒmprɪˈhɛnsɪv/","meanings":[{"pos":"adj.","definition":"complete; covering all or nearly all elements","translation":"toàn diện"}],"examples":[{"sentence":"The plan offers comprehensive coverage for overseas travel.","translation":"Gói bảo hiểm cung cấp phạm vi bảo vệ toàn diện khi đi nước ngoài."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"comprehensible","term":"comprehensible","ipa":"/ˌkɒmprɪˈhɛnsəbl/","meanings":[{"pos":"adj.","definition":"able to be understood","translation":"dễ hiểu"}],"examples":[{"sentence":"The instructions were rewritten to be comprehensible to new hires.","translation":"Hướng dẫn được viết lại để nhân viên mới dễ hiểu."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"confidential","term":"confidential","ipa":"/ˌkɒnfɪˈdɛnʃl/","meanings":[{"pos":"adj.","definition":"intended to be kept secret","translation":"bảo mật"}],"examples":[{"sentence":"Salary information is strictly confidential.","translation":"Thông tin lương là hoàn toàn bảo mật."}],"context":"Part 5","skill":"collocation","difficulty":3},{"id":"confident","term":"confident","ipa":"/ˈkɒnfɪdənt/","meanings":[{"pos":"adj.","definition":"feeling sure about your own ability or a situation","translation":"tự tin"}],"examples":[{"sentence":"Analysts are confident that demand will recover by spring.","translation":"Các nhà phân tích tự tin rằng nhu cầu sẽ hồi phục vào mùa xuân."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"diminish","term":"diminish","ipa":"/dɪˈmɪnɪʃ/","meanings":[{"pos":"v.","definition":"to make or become less","translation":"giảm bớt, suy giảm"}],"examples":[{"sentence":"Automation has not diminished the need for skilled oversight.","translation":"Tự động hoá không làm giảm nhu cầu giám sát có tay nghề."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"alleviate","term":"alleviate","ipa":"/əˈliːvieɪt/","meanings":[{"pos":"v.","definition":"to make a problem or pain less severe","translation":"làm dịu, giảm nhẹ"}],"examples":[{"sentence":"Hiring temporary staff should alleviate the seasonal backlog.","translation":"Thuê nhân viên thời vụ sẽ giảm nhẹ lượng tồn đọng theo mùa."}],"context":"Part 5","skill":"vocab","difficulty":5},{"id":"reinforce","term":"reinforce","ipa":"/ˌriːɪnˈfɔːrs/","meanings":[{"pos":"v.","definition":"to strengthen or support","translation":"củng cố, tăng cường"}],"examples":[{"sentence":"The training reinforces best practices for data handling.","translation":"Khoá đào tạo củng cố các thông lệ tốt nhất về xử lý dữ liệu."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"oversee","term":"oversee","ipa":"/ˌoʊvərˈsiː/","meanings":[{"pos":"v.","definition":"to supervise work or a process","translation":"giám sát, trông coi"}],"examples":[{"sentence":"She will oversee the transition to the new payroll system.","translation":"Cô ấy sẽ giám sát việc chuyển sang hệ thống trả lương mới."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"refrain","term":"refrain","ipa":"/rɪˈfreɪn/","meanings":[{"pos":"v.","definition":"to stop yourself from doing something","translation":"kiềm chế, tránh (+ from)"}],"examples":[{"sentence":"Passengers are asked to refrain from using phones during the safety demonstration.","translation":"Hành khách được đề nghị không dùng điện thoại trong lúc hướng dẫn an toàn."}],"context":"Part 5","skill":"collocation","difficulty":4},{"id":"yield","term":"yield","ipa":"/jiːld/","meanings":[{"pos":"v.","definition":"to produce or provide a result or profit","translation":"mang lại, sinh ra"},{"pos":"n.","definition":"the amount produced","translation":"sản lượng, lợi suất"}],"examples":[{"sentence":"The revised process yielded a 12 percent gain in output.","translation":"Quy trình sửa đổi mang lại mức tăng sản lượng 12 phần trăm."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"warrant","term":"warrant","ipa":"/ˈwɔːrənt/","meanings":[{"pos":"v.","definition":"to justify or make necessary","translation":"đủ lý do để, biện minh cho"}],"examples":[{"sentence":"The unusual ":"streamline","ipa":"/ˈstriːmlaɪn/","meanings":[{"pos":"v.","definition":"to make a process simpler and more efficient","translation":"tinh gọn, tối ưu quy trình"}],"examples":[{"sentence":"The software streamlines approval workflows across departments.","translation":"Phần mềm tinh gọn quy trình phê duyệt giữa các phòng ban."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"consolidate","term":"consolidate","ipa":"/kənˈsɒlɪdeɪt/","meanings":[{"pos":"v.","definition":"to combine several things into one more effective whole","translation":"hợp nhất, gộp lại"}],"examples":[{"sentence":"The firm consolidated three regional offices into one hub.","translation":"Công ty hợp nhất ba văn phòng vùng thành một trung tâm."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"incentive","term":"incentive","ipa":"/ɪnˈsɛntɪv/","meanings":[{"pos":"n.","definition":"something that encourages a person to do something","translation":"động lực, ưu đãi khuyến khích"}],"examples":[{"sentence":"The company offers a referral incentive for new hires.","translation":"Công ty có ưu đãi giới thiệu ứng viên mới."}],"context":"Part 5","skill":"vocab","difficulty":3},{"id":"provision","term":"provision","ipa":"/prəˈvɪʒn/","meanings":[{"pos":"n.","definition":"a condition or requirement in a legal document","translation":"điều khoản"}],"examples":[{"sentence":"A provision in the contract allows early termination with notice.","translation":"Một điều khoản trong hợp đồng cho phép chấm dứt sớm nếu báo trước."}],"context":"Part 5","skill":"vocab","difficulty":4},{"id":"oversight","term":"oversight","ipa":"/ˈoʊvərsaɪt/","meanings":[{"pos":"n.","definition":"supervision; general control","translation":"sự giám sát"},{"pos":"n.","definition":"an unintentional failure to notice something","translation":"sự sơ suất"}],"examples":[{"sentence":"A committee provides oversight of the pension fund.","translation":"Một uỷ ban giám sát quỹ hưu trí."}],"context":"Part 5","skill":"vocab","diff icult. By contrast, this quarter looks promising.","translation":"Năm ngoái khó khăn. Trái lại, quý này có vẻ hứa hẹn."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"all-the-same","term":"all the same","ipa":"/ɔːl ðə seɪm/","meanings":[{"pos":"phrase","definition":"despite what has been said; nevertheless","translation":"dù sao đi nữa"}],"examples":[{"sentence":"The fix is temporary; all the same, it stops the errors for now.","translation":"Bản vá là tạm thời; dù sao, nó cũng chặn được lỗi lúc này."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"namely","term":"namely","ipa":"/ˈneɪmli/","meanings":[{"pos":"adv.","definition":"that is to say; specifically","translation":"cụ thể là, tức là"}],"examples":[{"sentence":"Two teams missed the target, namely sales and support.","translation":"Hai nhóm không đạt chỉ tiêu, cụ thể là kinh doanh và hỗ trợ."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"in-turn","term":"in turn","ipa":"/ɪn tɜːrn/","meanings":[{"pos":"phrase","definition":"as a result of a previous action in a sequence","translation":"đến lượt nó, kéo theo"}],"examples":[{"sentence":"Faster shipping raised satisfaction, which in turn boosted repeat orders.","translation":"Giao hàng nhanh hơn làm tăng sự hài lòng, kéo theo đơn hàng lặp lại tăng."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"to-date","term":"to date","ipa":"/tuː deɪt/","meanings":[{"pos":"phrase","definition":"up to the present time","translation":"cho đến nay"}],"examples":[{"sentence":"To date, more than 5,000 customers have joined the program.","translation":"Cho đến nay, hơn 5.000 khách hàng đã tham gia chương trình."}],"context":"Part 6","skill":"grammar","difficulty":3},{"id":"going-forward","term":"going forward","ipa":"/ˈɡoʊɪŋ ˈfɔːrwərd/","meanings":[{"pos":"phrase","definition":"from now on; in the future","translation":"từ nay về sau"}],"examples":[{"sentence":"Going forward, invoices will be issued on the first of each month.","translation":"Từ nay về sau, hoá đơn sẽ xuất vào ngày đầu mỗi tháng."}],"context":"Part 6","skill":"grammar","difficulty":3},{"id":"as-previously-noted","term":"as previously noted","ipa":"/æz ˈpriːviəsli ˈnoʊtɪd/","meanings":[{"pos":"phrase","definition":"as mentioned earlier","translation":"như đã nêu trước đó"}],"examples":[{"sentence":"As previously noted, the office will close early on Friday.","translation":"Như đã nêu trước đó, văn phòng sẽ đóng cửa sớm vào thứ Sáu."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"in-summary","term":"in summary","ipa":"/ɪn ˈsʌməri/","meanings":[{"pos":"phrase","definition":"used to introduce a short final statement","translation":"tóm lại"}],"examples":[{"sentence":"In summary, the pilot met every success criterion.","translation":"Tóm lại, chương trình thử nghiệm đạt mọi tiêu chí thành công."}],"context":"Part 6","skill":"grammar","difficulty":3},{"id":"at-the-outset","term":"at the outset","ipa":"/æt ði ˈaʊtsɛt/","meanings":[{"pos":"phrase","definition":"at the beginning","translation":"ngay từ đầu"}],"examples":[{"sentence":"At the outset, the team agreed on clear ownership for each task.","translation":"Ngay từ đầu, nhóm đã thống nhất người phụ trách rõ ràng cho từng việc."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"given-that","term":"given that","ipa":"/ˈɡɪvn ðæt/","meanings":[{"pos":"phrase","definition":"considering that; because","translation":"vì rằng, xét thấy"}],"examples":[{"sentence":"Given that turnout was low, the session will be repeated.","translation":"Vì lượng tham dự thấp, buổi họp sẽ được tổ chức lại."}],"context":"Part 6","skill":"grammar","difficulty":4},{"id":"with-this-in-mind","term":"with this in mind","ipa":"/wɪð ðɪs ɪn maɪnd/","meanings":[{"pos":"phrase","definition":"taking this into account","translation":"với điều này trong đầu, do đó"}],"examples":[{"sentence":"Costs are rising. With this in mind, we froze non-essential spending.","translation":"Chi phí đ
