<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOEIC Flashcards</title>
<style>
  :root{
    --bg:#061017;--panel:#0c2029;--panel2:#0a1921;--line:#203943;
    --text:#edf8fa;--muted:#789099;--orange:#ff6428;--cyan:#40d9e7;--green:#50d391;--red:#e0503f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(#07141b,#040c11);color:var(--text);
    font-family:Arial,"Helvetica Neue",sans-serif;min-height:100vh}
  button,select,input{font:inherit}
  .hidden{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px max(16px,calc((100vw - 900px)/2));border-bottom:1px solid #19313a;
    background:#061017e8;position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}
  header h1{margin:0;font-size:18px;font-style:italic;color:#ff7541}
  header .streak{font-size:12px;font-weight:700;color:#ffc34a}
  main{width:min(900px,calc(100% - 32px));margin:auto;padding:24px 0 64px}
  .eyebrow{margin:0 0 6px;color:#66808a;font-size:9px;font-weight:900;letter-spacing:.2em}
  .sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 18px}

  /* deck picker */
  .decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .deck{border:1px solid var(--line);border-radius:6px;text-align:left;cursor:pointer;
    background:linear-gradient(145deg,#0f222b,#08171e);color:var(--text);padding:14px}
  .deck:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .deck b{display:block;font-size:14px}
  .deck small{display:block;color:#68808a;font-size:10px;margin-top:3px;line-height:1.4}
  .deck .count{color:#8fa4aa;font-size:10px;margin-top:8px}
  .mini{height:4px;background:#18323b;border-radius:3px;margin-top:8px;overflow:hidden}
  .mini i{display:block;height:100%;background:var(--green)}
  .deck .known{color:#68808a;font-size:10px;margin-top:4px}

  /* deck view */
  .back{border:0;background:none;color:var(--cyan);font-size:12px;font-weight:800;cursor:pointer;padding:0}
  h2.deck-title{font-size:17px;margin:10px 0 0}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:12px}
  .tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);
    padding:9px 12px;font-size:12px;cursor:pointer}
  .tab.active{border-color:var(--cyan);color:var(--cyan);font-weight:700}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;text-align:center}
  .statgrid div{border:1px solid var(--line);border-radius:5px;padding:9px 4px}
  .statgrid b{display:block;font-size:16px}
  .statgrid small{color:#687f87;font-size:9px}

  .filters,.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{border:1px solid var(--line);border-radius:999px;background:var(--panel);
    color:var(--muted);padding:5px 12px;font-size:11px;cursor:pointer}
  .chip.active{border-color:var(--cyan);color:var(--cyan);background:#2999a51a}
  .tools .chip.on{border-color:var(--orange);color:#ff9c76}

  .rate{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}
  .rate select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:4px 6px}

  .progress{color:var(--muted);font-size:11px;margin:14px 0 4px}
  .pbar{height:4px;background:#18323b;border-radius:3px;overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--cyan);transition:width .25s}

  .card{border:1px solid var(--line);border-radius:10px;padding:22px;margin-top:12px;
    background:linear-gradient(145deg,#0f222b,#08171e);cursor:pointer;user-select:none;
    min-height:230px;touch-action:pan-y;transition:transform .12s}
  .card .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .card .term{font-size:26px;font-weight:700;margin:0}
  .card .ipa{color:var(--muted);margin:4px 0 0}
  .card .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .sound{border:1px solid #2c6870;background:#2eb4c013;color:#55dbe7;border-radius:999px;
    padding:4px 10px;font-size:13px;cursor:pointer}
  .tag{background:#0d252e;border:1px solid #294852;border-radius:999px;color:#6faeb5;
    padding:2px 8px;font-size:10px}
  .diff{color:#5c757d;font-size:10px}
  .card .hint{color:#5c757d;font-size:11px;margin:22px 0 0}
  .card .back-body{margin-top:16px;display:flex;flex-direction:column;gap:10px}
  .card .mean b{font-style:italic;color:var(--muted);font-weight:400;font-size:12px}
  .card .mean .def{color:#dfeef0}
  .card .mean .tr{color:var(--muted);font-size:13px}
  .ex{background:#05111773;border:1px solid var(--line);border-radius:5px;padding:9px}
  .ex .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .ex .en{color:#c4d5d8;font-size:13px}
  .ex .tr{color:var(--muted);font-size:12px;margin-top:3px}

  .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .grade button{border:0;border-radius:5px;padding:11px;font-size:13px;font-weight:700;
    color:white;cursor:pointer}
  .g-no{background:var(--red)}.g-yes{background:var(--green)}

  .link{border:0;background:none;color:var(--cyan);font-size:11px;cursor:pointer;
    margin-top:12px;padding:0;text-decoration:underline}
  .unknown-list{margin:8px 0 0;padding:10px 10px 10px 28px;border:1px solid var(--line);
    border-radius:5px;font-size:12px;color:#c4d5d8;line-height:1.7}

  .empty{border:1px solid var(--line);border-radius:8px;padding:26px;text-align:center;
    color:var(--muted);margin-top:18px}

  /* overview */
  .ovhead{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .ovhead input{flex:1;min-width:160px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:4px;padding:7px 10px;font-size:13px}
  .ovhead select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:4px;padding:7px}
  .ovcount{color:var(--muted);font-size:11px;margin:8px 0}
  .ovlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .ovrow{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px;
    border-top:1px solid var(--line)}
  .ovrow:first-child{border-top:0}
  .ovrow .word{flex:1;text-align:left;background:none;border:0;color:var(--text);cursor:pointer}
  .ovrow .word .t{font-weight:700}
  .ovrow .word .i{color:var(--muted);font-size:11px;margin-left:6px}
  .ovrow .word .m{color:var(--muted);margin-left:6px}
  .badge{font-size:10px;border-radius:999px;padding:2px 8px;white-space:nowrap}
  .b-known{background:#25875933;color:#8fe9bb}
  .b-unknown{background:#a83a2733;color:#ffb0a5}
  .b-new{background:#1b333c;color:#8199a0}

  /* celebration */
  .overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;
    background:#01070bdc;backdrop-filter:blur(8px)}
  .cbox{max-width:360px;text-align:center;border:1px solid #4bd6e43d;border-radius:10px;
    background:#091a22;padding:26px}
  .cbox .cup{font-size:46px}
  .cbox h3{margin:8px 0 4px}
  .cbox p{color:var(--muted);font-size:13px}
  .cbox button{margin-top:14px;border:0;border-radius:5px;padding:9px 16px;font-weight:700;
    background:var(--cyan);color:#04141a;cursor:pointer}

  @media(max-width:620px){
    .decks{grid-template-columns:1fr}
    .grade{grid-template-columns:1fr 1fr}
    main{width:calc(100% - 24px)}
  }
</style>
</head>
<body>
<header>
  <h1>TOEIC Flashcards</h1>
  <span class="streak" id="streak"></span>
</header>
<main id="app"></main>

<script>
/* Word bank inlined at build time (tools/build-flashcards-html.mjs). */
const WORD_BANK = /*__WORD_BANK__*/;

/* ---------- storage ---------- */
const KEY = 'toeic-flashcards-html';
const RATES = [0.25,0.5,0.75,1,1.25,1.5,1.75,2];
const DEFAULT = { status:{}, order:{}, prefs:{ hideMeaning:false, rate:1 }, daily:{} };

function load(){
  try{
    const p = JSON.parse(localStorage.getItem(KEY)) || {};
    return {
      status: p.status||{}, order: p.order||{},
      prefs: Object.assign({}, DEFAULT.prefs, p.prefs),
      daily: p.daily||{},
    };
  }catch(e){ return structuredClone(DEFAULT); }
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function todayKey(d){ return (d||new Date()).toISOString().slice(0,10); }
function recordDaily(id){
  const k = todayKey();
  const set = new Set(S.daily[k]||[]);
  set.add(id);
  S.daily[k] = [...set];
}
function streak(){
  const days = new Set(Object.keys(S.daily).filter(d => (S.daily[d]||[]).length));
  if(!days.size) return 0;
  const cur = new Date();
  if(!days.has(todayKey(cur))) cur.setDate(cur.getDate()-1);
  let n = 0;
  while(days.has(todayKey(cur))){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function setStatus(id, st){ S.status[id] = st; recordDaily(id); save(); }

/* ---------- decks ---------- */
const CONTEXTS = [
  ['Part 5','Part 5 · Câu chưa hoàn chỉnh','Từ vựng & word form cho Part 5'],
  ['Part 6','Part 6 · Đoạn văn','Từ nối, mạch logic đoạn văn'],
  ['Part 7','Part 7 · Đọc hiểu','Từ vựng email, thông báo, bài báo'],
  ['Listening Part 3','Listening Part 3 · Hội thoại','Từ vựng hội thoại công sở'],
  ['Listening Part 4','Listening Part 4 · Bài nói','Từ vựng thông báo, bản tin'],
  ['General Business','Speaking & Writing · Business','Từ vựng dùng khi nói và viết'],
];
function mkDecks(){
  const d = [];
  d.push({ slug:'hard', name:'Bẫy khó · Band 900+', blurb:'near-synonym & collocation (độ khó 4–5)',
    ids: WORD_BANK.filter(w=>w.difficulty>=4).map(w=>w.id) });
  d.push({ slug:'core', name:'Nền tảng · 700+', blurb:'Từ độ khó vừa (độ khó 2–3)',
    ids: WORD_BANK.filter(w=>w.difficulty>=2&&w.difficulty<=3).map(w=>w.id) });
  for(const [ctx,name,blurb] of CONTEXTS){
    d.push({ slug: ctx.toLowerCase().replace(/[^a-z0-9]+/g,'-'), name, blurb,
      ids: WORD_BANK.filter(w=>w.context===ctx).map(w=>w.id) });
  }
  d.push({ slug:'all', name:'Toàn bộ từ vựng', blurb:'Học tuần tự cả ngân hàng',
    ids: WORD_BANK.map(w=>w.id) });
  return d.filter(x=>x.ids.length);
}
const DECKS = mkDecks();
const WORD = Object.fromEntries(WORD_BANK.map(w=>[w.id,w]));

function counts(ids){
  let known=0, unknown=0;
  for(const id of ids){
    const s = S.status[id];
    if(s==='known') known++; else if(s==='unknown') unknown++;
  }
  return { total:ids.length, known, unknown, unseen:ids.length-known-unknown };
}
function filterIds(ids, f){
  if(f==='all') return ids.slice();
  if(f==='unseen') return ids.filter(id=>!S.status[id]);
  return ids.filter(id=>S.status[id]===f);
}
function shuffle(a){
  const c = a.slice();
  for(let i=c.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
  return c;
}
function speak(text, rate){
  if(!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = Math.min(2, Math.max(0.25, rate||1));
  speechSynthesis.speak(u);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- view state ---------- */
let view = { screen:'picker' };

function render(){
  document.getElementById('streak').textContent = streak()>0 ? '🔥 '+streak()+' ngày' : '';
  const app = document.getElementById('app');
  if(view.screen==='deck') renderDeck(app);
  else renderPicker(app);
}

function renderPicker(app){
  const all = DECKS.find(d=>d.slug==='all');
  const c = counts(all.ids);
  app.innerHTML = `
    <p class="eyebrow">HSK-STYLE · BAND 900+</p>
    <p class="sub">Đã nhớ <b>${c.known}</b> / ${c.total} từ. Chọn bộ để học — vuốt phải / bấm
      <b>Đã nhớ</b> nếu nhớ, vuốt trái / <b>Chưa nhớ</b> nếu chưa.</p>
    <div class="decks">
      ${DECKS.map(d=>{
        const dc = counts(d.ids);
        const pct = dc.total ? Math.round(dc.known/dc.total*100) : 0;
        return `<button class="deck" data-slug="${d.slug}">
          <b>${esc(d.name)}</b>
          <small>${esc(d.blurb)}</small>
          <div class="count">${d.ids.length} từ</div>
          <div class="mini"><i style="width:${pct}%"></i></div>
          <div class="known">Đã nhớ ${dc.known} / ${dc.total}</div>
        </button>`;
      }).join('')}
    </div>`;
  app.querySelectorAll('.deck').forEach(b=>{
    b.onclick = ()=>{ view = { screen:'deck', slug:b.dataset.slug, tab:'cards',
      filter:'all', jumpId:null, idx:0, revealed:false, order:null, showUnknown:false }; render(); };
  });
}

function currentOrder(deck){
  if(view.order) return view.order;
  const saved = S.order[view.slug];
  if(saved && saved.length===deck.ids.length){
    return saved.map(i=>deck.ids[i]).filter(Boolean);
  }
  return deck.ids.slice();
}

function renderDeck(app){
  const deck = DECKS.find(d=>d.slug===view.slug);
  const c = counts(deck.ids);
  const order = currentOrder(deck);
  const list = view.jumpId ? [view.jumpId] : filterIds(order, view.filter);
  const cur = list.length ? WORD[list[view.idx % list.length]] : null;
  const pos = list.length ? (view.idx % list.length) + 1 : 0;

  app.innerHTML = `
    <button class="back" id="back">← Chọn bộ khác</button>
    <h2 class="deck-title">${esc(deck.name)}</h2>
    <div class="tabs">
      <button class="tab ${view.tab==='cards'?'active':''}" data-tab="cards">🗂 Học flashcard</button>
      <button class="tab ${view.tab==='overview'?'active':''}" data-tab="overview">📋 Tổng quan</button>
    </div>
    ${view.tab==='overview' ? overviewHTML(deck) : `
      <div class="statgrid">
        <div><b>${c.total}</b><small>tổng</small></div>
        <div><b style="color:var(--red)">${c.unknown}</b><small>chưa nhớ</small></div>
        <div><b style="color:var(--green)">${c.known}</b><small>đã nhớ</small></div>
        <div><b style="color:var(--muted)">${c.unseen}</b><small>chưa học</small></div>
      </div>
      <div class="filters">
        ${['all','unknown','known','unseen'].map(f=>{
          const lbl = {all:'Tất cả',unknown:'Chưa nhớ',known:'Đã nhớ',unseen:'Chưa học'}[f];
          return `<button class="chip ${view.filter===f&&!view.jumpId?'active':''}" data-filter="${f}">${lbl}</button>`;
        }).join('')}
      </div>
      <div class="rate">
        Tốc độ đọc ví dụ
        <select id="rate">${RATES.map(r=>`<option value="${r}" ${r===S.prefs.rate?'selected':''}>${r}x</option>`).join('')}</select>
      </div>
      <div class="tools">
        <button class="chip" id="shuffle">🔀 Xáo trộn</button>
        <button class="chip ${S.prefs.hideMeaning?'on':''}" id="hide">${S.prefs.hideMeaning?'🙈 Đang ẩn nghĩa':'👁 Đang hiện nghĩa'}</button>
        <button class="chip" id="reset">↻ Học lại từ đầu</button>
      </div>
      ${cur ? `
        <p class="progress">${pos} / ${list.length}</p>
        <div class="pbar"><i style="width:${list.length?pos/list.length*100:0}%"></i></div>
        ${cardHTML(cur)}
        <div class="grade">
          <button class="g-no" id="g-no">Chưa nhớ</button>
          <button class="g-yes" id="g-yes">Đã nhớ</button>
        </div>
        <button class="link" id="toggle-unknown">${view.showUnknown?'Ẩn từ chưa nhớ':'Hiển thị từ chưa nhớ'}</button>
        ${view.showUnknown ? unknownListHTML(deck) : ''}
      ` : `<div class="empty">Không có từ trong bộ lọc này.<br>Đổi bộ lọc hoặc bấm "Học lại từ đầu".</div>`}
    `}
  `;

  app.querySelector('#back').onclick = ()=>{ view = { screen:'picker' }; render(); };
  app.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ view.tab = b.dataset.tab; view.jumpId=null; render(); };
  });

  if(view.tab==='overview'){ wireOverview(app, deck); return; }

  app.querySelectorAll('.chip[data-filter]').forEach(b=>{
    b.onclick = ()=>{ view.filter=b.dataset.filter; view.jumpId=null; view.idx=0; view.revealed=false; render(); };
  });
  const rateSel = app.querySelector('#rate');
  if(rateSel) rateSel.onchange = ()=>{ S.prefs.rate = Number(rateSel.value); save(); };
  app.querySelector('#shuffle').onclick = ()=>{
    const sh = shuffle(deck.ids);
    view.order = sh; view.idx = 0; view.revealed = false;
    const map = new Map(deck.ids.map((id,i)=>[id,i]));
    S.order[view.slug] = sh.map(id=>map.get(id)); save();
    render();
  };
  app.querySelector('#hide').onclick = ()=>{ S.prefs.hideMeaning = !S.prefs.hideMeaning; save(); render(); };
  app.querySelector('#reset').onclick = ()=>{
    if(!confirm(`Học lại từ đầu bộ "${deck.name}"? Trạng thái đã nhớ/chưa nhớ của bộ này sẽ bị xoá.`)) return;
    for(const id of deck.ids) delete S.status[id];
    delete S.order[view.slug];
    save();
    view.order=null; view.idx=0; view.revealed=false; render();
  };

  const card = app.querySelector('.card');
  if(card){
    wireCard(card, cur);
    app.querySelector('#g-no').onclick = ()=>grade(false, cur, deck);
    app.querySelector('#g-yes').onclick = ()=>grade(true, cur, deck);
    const tu = app.querySelector('#toggle-unknown');
    if(tu) tu.onclick = ()=>{ view.showUnknown = !view.showUnknown; render(); };
  }
}

function cardHTML(w){
  const back = view.revealed;
  const pips = '●'.repeat(w.difficulty) + '○'.repeat(5-w.difficulty);
  return `<div class="card">
    <div class="head">
      <div>
        <p class="term">${esc(w.term)}</p>
        ${w.ipa && !S.prefs.hideMeaning ? `<p class="ipa">${esc(w.ipa)}</p>` : ''}
      </div>
      <div class="meta">
        <button class="sound" data-say="${esc(w.term)}">🔊</button>
        <span class="tag">${esc(w.context)}</span>
        <span class="diff">độ khó ${pips}</span>
      </div>
    </div>
    ${back ? `<div class="back-body">
      ${w.meanings.map(m=>`<div class="mean">
        <b>${esc(m.pos)}</b> <span class="def">${esc(m.definition)}</span>
        ${m.translation?`<div class="tr">${esc(m.translation)}</div>`:''}
      </div>`).join('')}
      ${w.examples.map(e=>`<div class="ex">
        <div class="row">
          <span class="en">${esc(e.sentence)}</span>
          <button class="sound" data-say="${esc(e.sentence)}" data-ex="1">🔊</button>
        </div>
        ${e.translation?`<div class="tr">${esc(e.translation)}</div>`:''}
      </div>`).join('')}
    </div>` : `<p class="hint">Nhấn / phím Space để xem nghĩa · phím 1 = chưa nhớ · 2 = đã nhớ</p>`}
  </div>`;
}

function unknownListHTML(deck){
  const rows = deck.ids.filter(id=>S.status[id]==='unknown').map(id=>WORD[id]).filter(Boolean);
  if(!rows.length) return `<div class="unknown-list">Chưa có từ nào đánh dấu "Chưa nhớ".</div>`;
  return `<ol class="unknown-list">${rows.map(w=>
    `<li><b>${esc(w.term)}</b>${w.ipa?` <span style="color:var(--muted)">${esc(w.ipa)}</span>`:''} — ${esc(w.meanings[0].translation||w.meanings[0].definition)}</li>`
  ).join('')}</ol>`;
}

function wireCard(card, w){
  card.querySelectorAll('.sound').forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); speak(b.dataset.say, b.dataset.ex ? S.prefs.rate : 1); };
  });
  let sx=0, active=false, locked=null, dx=0;
  card.addEventListener('pointerdown', e=>{
    if(e.target.closest('.sound')) return;
    sx=e.clientX; active=true; locked=null; dx=0;
  });
  card.addEventListener('pointermove', e=>{
    if(!active) return;
    dx = e.clientX - sx;
    if(!locked && Math.abs(dx)>8) locked='h';
    if(locked==='h'){ card.setPointerCapture(e.pointerId); card.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`; }
  });
  card.addEventListener('pointerup', ()=>{
    if(!active) return; active=false;
    card.style.transform='';
    if(locked!=='h'){ view.revealed=!view.revealed; render(); return; }
    if(Math.abs(dx)>=90) gradeCurrent(dx>0);
  });
  card.addEventListener('pointercancel', ()=>{ active=false; card.style.transform=''; });
}

function gradeCurrent(known){
  const deck = DECKS.find(d=>d.slug===view.slug);
  const order = currentOrder(deck);
  const list = view.jumpId ? [view.jumpId] : filterIds(order, view.filter);
  const cur = list.length ? WORD[list[view.idx % list.length]] : null;
  grade(known, cur, deck);
}

function grade(known, w, deck){
  if(!w) return;
  setStatus(w.id, known ? 'known' : 'unknown');
  if(known && counts(deck.ids).known === deck.ids.length){
    showCelebration(deck);
  }
  view.revealed = false;
  view.jumpId = null;
  view.idx += 1;
  render();
}

/* ---------- overview ---------- */
function overviewHTML(deck){
  return `<div class="ovhead">
    <input id="ov-q" type="search" placeholder="Tìm từ, IPA hoặc nghĩa…" value="${esc(view.ovQ||'')}">
    <select id="ov-status">
      <option value="all">Tất cả trạng thái</option>
      <option value="unseen">Chưa học</option>
      <option value="unknown">Chưa nhớ</option>
      <option value="known">Đã nhớ</option>
    </select>
  </div>
  <div class="ovcount" id="ov-count"></div>
  <div class="ovlist" id="ov-list"></div>`;
}
function wireOverview(app, deck){
  const q = app.querySelector('#ov-q');
  const st = app.querySelector('#ov-status');
  st.value = view.ovStatus || 'all';
  function draw(){
    view.ovQ = q.value; view.ovStatus = st.value;
    const term = q.value.trim().toLowerCase();
    const rows = deck.ids.map(id=>WORD[id]).filter(Boolean).filter(w=>{
      const s = S.status[w.id];
      if(st.value==='unseen' && s) return false;
      if((st.value==='known'||st.value==='unknown') && s!==st.value) return false;
      if(!term) return true;
      const hay = (w.term+' '+(w.ipa||'')+' '+w.meanings.map(m=>m.definition+' '+(m.translation||'')).join(' ')).toLowerCase();
      return hay.includes(term);
    });
    app.querySelector('#ov-count').textContent = rows.length + ' từ';
    app.querySelector('#ov-list').innerHTML = rows.map(w=>{
      const s = S.status[w.id];
      const b = s==='known' ? ['b-known','Đã nhớ'] : s==='unknown' ? ['b-unknown','Chưa nhớ'] : ['b-new','Chưa học'];
      return `<div class="ovrow">
        <button class="sound" data-say="${esc(w.term)}">🔊</button>
        <button class="word" data-id="${w.id}">
          <span class="t">${esc(w.term)}</span>
          ${w.ipa?`<span class="i">${esc(w.ipa)}</span>`:''}
          <span class="m">${esc(w.meanings[0].translation||w.meanings[0].definition)}</span>
        </button>
        <span class="badge ${b[0]}">${b[1]}</span>
      </div>`;
    }).join('');
    app.querySelectorAll('#ov-list .sound').forEach(x=> x.onclick = e=>{ e.stopPropagation(); speak(x.dataset.say,1); });
    app.querySelectorAll('#ov-list .word').forEach(x=>{
      x.onclick = ()=>{ view.jumpId = x.dataset.id; view.filter='all'; view.tab='cards';
        view.idx=0; view.revealed=false; render(); };
    });
  }
  q.oninput = draw;
  st.onchange = draw;
  draw();
}

/* ---------- celebration ---------- */
function showCelebration(deck){
  const el = document.createElement('div');
  el.className = 'overlay';
  el.innerHTML = `<div class="cbox">
    <div class="cup">🏆</div>
    <h3>Xuất sắc!</h3>
    <p>Bạn đã nhớ toàn bộ <b>${deck.ids.length}</b> từ trong bộ <b>${esc(deck.name)}</b>.</p>
    <button>Tiếp tục</button>
  </div>`;
  el.onclick = e=>{ if(e.target===el || e.target.tagName==='BUTTON') el.remove(); };
  document.body.appendChild(el);
}

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e=>{
  if(view.screen!=='deck' || view.tab!=='cards') return;
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(e.code==='Space'){ e.preventDefault(); view.revealed=!view.revealed; render(); }
  else if(e.key==='1') gradeCurrent(false);
  else if(e.key==='2') gradeCurrent(true);
});

render();
</script>
</body>
</html>
