name: Deploy Vu Dai TOEIC to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - vu-dai-toeic.html
      - apps/web/src/lib/question-bank.js
      - apps/web/public/characters/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/apps/web/src/lib
          cp vu-dai-toeic.html _site/index.html
          cp apps/web/src/lib/question-bank.js _site/apps/web/src/lib/question-bank.js
          cp -R apps/web/public/characters _site/characters
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
